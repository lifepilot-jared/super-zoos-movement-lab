ent:"";position:absolute;left:30px;bottom:0;width:13px;height:56px;background:#7c4c2d}.tree:after{content:"";position:absolute;left:4px;top:0;width:62px;height:72px;border-radius:50%;background:#2e8c46;box-shadow:18px 13px 0 #42aa58,-15px 15px 0 #27793c}.banner{width:55px;height:94px;background:#075596;border:5px solid #e4b737;color:#ffd84b;font-size:10px;font-weight:950;text-align:center;padding-top:15px}.p1{animation-delay:-.2s}.p2{animation-delay:-1.7s}.p3{animation-delay:-3.2s}.player{--lane:0px;--hop:0px;position:absolute;left:50%;bottom:3.5%;width:clamp(155px,25vw,235px);height:clamp(205px,31vw,300px);transform:translate(calc(-50% + var(--lane)),var(--hop));transform-origin:50% 100%;transition:transform 170ms ease-out;z-index:30}.player.hopping{transition:transform 30ms linear}.player canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 13px 9px #0007)}.shadow{position:absolute;left:50%;bottom:4%;width:105px;height:24px;border-radius:50%;background:#0005;filter:blur(4px);transform:translateX(-50%);z-index:25}.hint{position:absolute;left:50%;top:39%;transform:translateX(-50%);padding:9px 16px;border-radius:18px;background:#17364ddd;color:#fff;font-size:12px;font-weight:900;text-align:center;z-index:35}.loading{position:absolute;left:50%;bottom:23%;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:#102f48e8;color:#fff;font-weight:900;z-index:40}@media(max-width:700px){.game{grid-template-rows:82px 1fr}.hud{padding-top:max(10px,env(safe-area-inset-top));grid-template-columns:1fr auto 1fr}.title{font-size:13px}.score{padding:5px 12px}.skyline{top:6%;height:25%}.main{width:43vw}.left1{right:74%;width:30vw}.right1{left:74%;width:30vw}.world{inset:27% 0 0}.grassL,.grassR{width:10%}.walkL,.walkR{width:8%}.walkL{left:10%}.walkR{right:10%}.curbL{left:18%}.curbR{right:18%}.road{left:18%;right:18%;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}.safeL,.safeR{width:18%}.safeL .lamp,.safeL .tree,.safeL .banner{right:3%}.safeR .lamp,.safeR .tree,.safeR .banner{left:3%}.player{width:clamp(150px,37vw,200px);height:clamp(195px,47vw,255px);bottom:4%}.hint{top:32%;font-size:10px;padding:8px 10px}}</style></head><body><main class="game"><header class="hud"><div class="title">SUPER ZOOS<br>SCHOOL RUN</div><div class="score"><small>SCORE</small><span id="score">000000</span></div><div class="status" id="status">LOADING</div></header><section class="scene" id="scene"><div class="skyline"><div class="building left2"></div><div class="building left1"></div><div class="building main"><div class="schoolSign">SUPER ZOOS SCHOOL</div><div class="door"></div><div class="windowRow"><i></i><i></i><i></i><i></i></div></div><div class="building right1"></div><div class="building right2"></div></div><div class="world"><div class="grassL"></div><div class="grassR"></div><div class="walkL"></div><div class="walkR"></div><div class="curbL"></div><div class="curbR"></div><div class="road"><div class="divider d1"></div><div class="divider d2"></div></div><div class="safeL"><div class="lamp p1"></div><div class="tree p2"></div><div class="banner p3">SUPER<br>ZOOS</div></div><div class="safeR"><div class="tree p1"></div><div class="banner p2">SUPER<br>ZOOS</div><div class="lamp p3"></div></div></div><div class="hint">PHASE 1: CAMERA + ROAD<br>SWIPE ← → · SWIPE ↑</div><div class="shadow" id="shadow"></div><div class="player" id="player"><canvas id="peter" width="400" height="520"></canvas></div><div class="loading" id="loading">Preparing Spider-Boy…</div></section></main><script>const BUILD='v14-phase1';const RUN='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter/prototype/run';const urls=Array.from({length:12},(_,i)=>`${RUN}/run-${String(i+1).padStart(2,'0')}.png?${BUILD}`);let frames=[],idx=0,lane=1,ready=false,hopping=false,timer,startX=0,startY=0,points=0;const canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),player=document.getElementById('player'),shadow=document.getElementById('shadow'),status=document.getElementById('status'),loading=document.getElementById('loading'),scene=document.getElementById('scene'),score=document.getElementById('score');function load(src){return new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}function isolate(img){const s=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data,m=new Uint8Array(w*h);for(let p=0,k=0;p<m.length;p++,k+=4){const r=d[k],g=d[k+1],b=d[k+2],a=d[k+3];m[p]=a>20&&((r>48&&r>g*1.18&&r>b*1.08)||(r<145&&g<145&&b<145))?1:0}const seen=new Uint8Array(m.length);let win,best=-1;for(let p=0;p<m.length;p++){if(!m[p]||seen[p])continue;const st=[p],comp=[];seen[p]=1;let sx=0,sy=0;while(st.length){const q=st.pop(),qx=q%w,qy=q/w|0;comp.push(q);sx+=qx;sy+=qy;for(const n of [qx>0?q-1:-1,qx<w-1?q+1:-1,qy>0?q-w:-1,qy<h-1?q+w:-1])if(n>=0&&m[n]&&!seen[n]){seen[n]=1;st.push(n)}}const cx=sx/comp.length,cy=sy/comp.length,dist=Math.hypot((cx-w/2)/w,(cy-h*.58)/h),sc=comp.length/(1+3*dist);if(comp.length>120&&sc>best){best=sc;win=comp}}if(!win)throw Error('run component missing');const keep=new Uint8Array(m.length);for(const p of win)keep[p]=1;let minX=w,minY=h,maxX=0,maxY=0;for(let p=0;p<keep.length;p++){const k=p*4;if(!keep[p])d[k+3]=0;else{const px=p%w,py=p/w|0;minX=Math.min(minX,px);maxX=Math.max(maxX,px);minY=Math.min(minY,py);maxY=Math.max(maxY,py)}}x.putImageData(im,0,0);const pad=8,sx=Math.max(0,minX-pad),sy=Math.max(0,minY-pad),sw=Math.min(w-sx,maxX-minX+1+pad*2),sh=Math.min(h-sy,maxY-minY+1+pad*2),out=document.createElement('canvas');out.width=400;out.height=520;const o=out.getContext('2d'),scale=Math.min(330/sw,430/sh),dw=sw*scale,dh=sh*scale;o.drawImage(c,sx,sy,sw,sh,(400-dw)/2,500-dh,dw,dh);return out}async function prep(){try{for(let i=0;i<12;i++){frames.push(isolate(await load(urls[i])));status.textContent=`RUN ${i+1}/12`}ready=true;loading.remove();setLane();loop()}catch(e){loading.textContent='LOAD ERROR';status.textContent='ERROR';console.error(e)}}function draw(f=frames[idx]){ctx.clearRect(0,0,400,520);ctx.drawImage(f,0,0)}function loop(){clearTimeout(timer);if(!ready||hopping)return;draw();points++;score.textContent=String(points).padStart(6,'0');status.textContent=`LANE ${lane+1} · RUN ${idx+1}/12`;timer=setTimeout(()=>{idx=(idx+1)%12;loop()},115)}function laneWidth(){const r=document.querySelector('.road').getBoundingClientRect();return r.width/3}function setLane(){const x=(lane-1)*laneWidth();player.style.setProperty('--lane',`${x}px`);shadow.style.transform=`translateX(calc(-50% + ${x}px))`}function move(d){lane=Math.max(0,Math.min(2,lane+d));setLane()}function hop(){if(!ready||hopping)return;hopping=true;clearTimeout(timer);player.classList.add('hopping');const frozen=frames[0],duration=760,height=120,start=performance.now();function step(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop',`${y}px`);draw(frozen);if(t<1)requestAnimationFrame(step);else{player.style.setProperty('--hop','0px');player.classList.remove('hopping');hopping=false;idx=1;loop()}}requestAnimationFrame(step)}scene.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});scene.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;if(Math.abs(dy)>Math.abs(dx)&&dy<0)hop();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1)});addEventListener('resize',setLane);prep()</script></body></html>
