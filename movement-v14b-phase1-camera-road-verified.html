<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store"><title>Super Zoos Phase 1B</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#68cff4;touch-action:none}.game{position:fixed;inset:0;display:grid;grid-template-rows:76px 1fr}.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:max(10px,env(safe-area-inset-top)) 16px 8px;background:linear-gradient(#0b3658,#072941);color:#fff;z-index:50}.title{font-weight:950;line-height:1.05;font-size:clamp(13px,2vw,22px)}.score{padding:5px 18px;border-radius:24px;background:#061f35;text-align:center;font-weight:950}.score small{display:block;color:#69cbff}.status{text-align:right;font-weight:950}.scene{position:relative;overflow:hidden;background:linear-gradient(#62cdf3 0 31%,#bcecff 31% 36%,#75bb4d 36% 100%)}.campus{position:absolute;left:0;right:0;top:7%;height:29%;z-index:2}.building{position:absolute;bottom:0;border:4px solid #98532f;box-shadow:0 8px 18px #0003}.building:before{content:"";position:absolute;left:-4px;right:-4px;top:-22px;height:22px;background:#c75434;clip-path:polygon(7% 100%,16% 0,84% 0,93% 100%)}.main{left:50%;transform:translateX(-50%);width:min(31vw,390px);height:78%;background:#e9bc67;z-index:4}.wingL{right:66%;width:min(23vw,280px);height:58%;background:#d77f48}.wingR{left:66%;width:min(23vw,280px);height:58%;background:#e2c26e}.schoolSign{position:absolute;left:50%;top:13%;transform:translateX(-50%);padding:6px 14px;border-radius:6px;background:#963e31;color:#fff;font-weight:950;white-space:nowrap}.door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:18%;height:44%;background:#315a78;border:5px solid #f0dcaa}.windowRow{position:absolute;left:8%;right:8%;top:39%;display:flex;justify-content:space-between}.windowRow i{width:14%;height:23px;background:#9ee5ff;border:4px solid #f6e6b7}.ground{position:absolute;left:0;right:0;top:34%;bottom:0;z-index:5;overflow:hidden}.road{position:absolute;inset:0;background:linear-gradient(90deg,#252a2e 0,#3d4348 5%,#555c62 50%,#3d4348 95%,#252a2e 100%);clip-path:polygon(36% 0,64% 0,99% 100%,1% 100%);overflow:hidden}.road:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,#ffffff12,transparent 25%,#00000024 100%)}.walkL,.walkR{position:absolute;inset:0;background:linear-gradient(#ddd7cc,#bdb7ac);z-index:-1}.walkL{clip-path:polygon(27% 0,36% 0,1% 100%,0 100%)}.walkR{clip-path:polygon(64% 0,73% 0,100% 100%,99% 100%)}.grassL,.grassR{position:absolute;inset:0;background:linear-gradient(#79c455,#4da03a);z-index:-2}.grassL{clip-path:polygon(0 0,27% 0,0 100%)}.grassR{clip-path:polygon(73% 0,100% 0,100% 100%)}.edgeL,.edgeR{position:absolute;top:0;bottom:0;width:5px;background:#f4d44b;z-index:4;transform-origin:top}.edgeL{left:36%;transform:skewX(-25deg)}.edgeR{right:36%;transform:skewX(25deg)}.divider{position:absolute;top:-130%;height:260%;width:0.8%;background:repeating-linear-gradient(to bottom,#fff 0 28px,transparent 28px 70px);animation:flow .86s linear infinite;z-index:3}.d1{left:33.33%}.d2{left:66.66%}@keyframes flow{to{transform:translateY(70px)}}.player{--lane:0px;--hop:0px;position:absolute;left:50%;bottom:2.5%;width:clamp(165px,27vw,245px);height:clamp(215px,34vw,310px);transform:translate(calc(-50% + var(--lane)),var(--hop));transform-origin:50% 100%;transition:transform 170ms ease-out;z-index:30}.player.hopping{transition:transform 30ms linear}.player canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 13px 9px #0008)}.shadow{position:absolute;left:50%;bottom:3.2%;width:112px;height:25px;border-radius:50%;background:#0005;filter:blur(4px);transform:translateX(-50%);z-index:25}.hint{position:absolute;left:50%;top:4%;transform:translateX(-50%);padding:7px 13px;border-radius:16px;background:#17364ddd;color:#fff;font-size:11px;font-weight:900;text-align:center;z-index:35;white-space:nowrap}.loading{position:absolute;left:50%;bottom:23%;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:#102f48e8;color:#fff;font-weight:900;z-index:40}@media(max-width:700px){.game{grid-template-rows:82px 1fr}.title{font-size:13px}.score{padding:5px 12px}.campus{top:6%;height:27%}.main{width:42vw}.wingL{right:72%;width:28vw}.wingR{left:72%;width:28vw}.ground{top:31%}.road{clip-path:polygon(34% 0,66% 0,100% 100%,0 100%)}.walkL{clip-path:polygon(24% 0,34% 0,0 100%)}.walkR{clip-path:polygon(66% 0,76% 0,100% 100%)}.grassL{clip-path:polygon(0 0,24% 0,0 100%)}.grassR{clip-path:polygon(76% 0,100% 0,100% 100%)}.edgeL{left:34%}.edgeR{right:34%}.player{width:clamp(160px,40vw,215px);height:clamp(205px,50vw,270px);bottom:2.5%}.hint{top:3%;font-size:10px}}</style></head><body><main class="game"><header class="hud"><div class="title">SUPER ZOOS<br>SCHOOL RUN</div><div class="score"><small>SCORE</small><span id="score">000000</span></div><div class="status" id="status">LOADING</div></header><section class="scene" id="scene"><div class="campus"><div class="building wingL"></div><div class="building main"><div class="schoolSign">SUPER ZOOS SCHOOL</div><div class="door"></div><div class="windowRow"><i></i><i></i><i></i><i></i></div></div><div class="building wingR"></div></div><div class="ground"><div class="grassL"></div><div class="grassR"></div><div class="walkL"></div><div class="walkR"></div><div class="road"><div class="divider d1"></div><div class="divider d2"></div></div></div><div class="hint">PHASE 1B · CAMERA + ROAD ONLY</div><div class="shadow" id="shadow"></div><div class="player" id="player"><canvas id="peter" width="400" height="520"></canvas></div><div class="loading" id="loading">Preparing Spider-Boy…</div></section></main><script>const BUILD='v14b-phase1-verified';const RUN='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter/prototype/run';const urls=Array.from({length:12},(_,i)=>`${RUN}/run-${String(i+1).padStart(2,'0')}.png?${BUILD}`);let frames=[],idx=0,lane=1,ready=false,hopping=false,timer,startX=0,startY=0,points=0;const canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),player=document.getElementById('player'),shadow=document.getElementById('shadow'),status=document.getElementById('status'),loading=document.getElementById('loading'),scene=document.getElementById('scene'),score=document.getElementById('score');function load(src){return new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}function isolate(img){const s=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data,m=new Uint8Array(w*h);for(let p=0,k=0;p<m.length;p++,k+=4){const r=d[k],g=d[k+1],b=d[k+2],a=d[k+3];m[p]=a>20&&((r>48&&r>g*1.18&&r>b*1.08)||(r<145&&g<145&&b<145))?1:0}const seen=new Uint8Array(m.length);let win,best=-1;for(let p=0;p<m.length;p++){if(!m[p]||seen[p])continue;const st=[p],comp=[];seen[p]=1;let sx=0,sy=0;while(st.length){const q=st.pop(),qx=q%w,qy=q/w|0;comp.push(q);sx+=qx;sy+=qy;for(const n of [qx>0?q-1:-1,qx<w-1?q+1:-1,qy>0?q-w:-1,qy<h-1?q+w:-1])if(n>=0&&m[n]&&!seen[n]){seen[n]=1;st.push(n)}}const cx=sx/comp.length,cy=sy/comp.length,dist=Math.hypot((cx-w/2)/w,(cy-h*.58)/h),sc=comp.length/(1+3*dist);if(comp.length>120&&sc>best){best=sc;win=comp}}if(!win)throw Error('run component missing');const keep=new Uint8Array(m.length);for(const p of win)keep[p]=1;let minX=w,minY=h,maxX=0,maxY=0;for(let p=0;p<keep.length;p++){const k=p*4;if(!keep[p])d[k+3]=0;else{const px=p%w,py=p/w|0;minX=Math.min(minX,px);maxX=Math.max(maxX,px);minY=Math.min(minY,py);maxY=Math.max(maxY,py)}}x.putImageData(im,0,0);const pad=8,sx=Math.max(0,minX-pad),sy=Math.max(0,minY-pad),sw=Math.min(w-sx,maxX-minX+1+pad*2),sh=Math.min(h-sy,maxY-minY+1+pad*2),out=document.createElement('canvas');out.width=400;out.height=520;const o=out.getContext('2d'),scale=Math.min(330/sw,430/sh),dw=sw*scale,dh=sh*scale;o.drawImage(c,sx,sy,sw,sh,(400-dw)/2,500-dh,dw,dh);return out}async function prep(){try{for(let i=0;i<12;i++){frames.push(isolate(await load(urls[i])));status.textContent=`RUN ${i+1}/12`}ready=true;loading.remove();setLane();loop()}catch(e){loading.textContent='LOAD ERROR';status.textContent='ERROR';console.error(e)}}function draw(f=frames[idx]){ctx.clearRect(0,0,400,520);ctx.drawImage(f,0,0)}function loop(){clearTimeout(timer);if(!ready||hopping)return;draw();points++;score.textContent=String(points).padStart(6,'0');status.textContent=`LANE ${lane+1} · RUN ${idx+1}/12`;timer=setTimeout(()=>{idx=(idx+1)%12;loop()},115)}function laneStep(){return Math.min(innerWidth*.255,245)}function setLane(){const x=(lane-1)*laneStep();player.style.setProperty('--lane',`${x}px`);shadow.style.transform=`translateX(calc(-50% + ${x}px))`}function move(d){lane=Math.max(0,Math.min(2,lane+d));setLane()}function hop(){if(!ready||hopping)return;hopping=true;clearTimeout(timer);player.classList.add('hopping');const frozen=frames[0],duration=760,height=120,start=performance.now();function step(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop',`${y}px`);draw(frozen);if(t<1)requestAnimationFrame(step);else{player.style.setProperty('--hop','0px');player.classList.remove('hopping');hopping=false;idx=1;loop()}}requestAnimationFrame(step)}scene.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});scene.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;if(Math.abs(dy)>Math.abs(dx)&&dy<0)hop();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1)});addEventListener('resize',setLane);prep()</script></body></html>
