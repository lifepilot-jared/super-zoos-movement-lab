<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Super Zoos Movement Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#8ed8f1;touch-action:none}.lab{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:#8ed8f1}.top{z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:rgba(10,28,45,.88);color:white;font-weight:800}.top span{font-size:12px}.scene{position:relative;overflow:hidden;background:linear-gradient(#80d6f3 0 42%,#79b85e 42% 100%)}.school{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:min(76vw,700px);height:18%;border-radius:12px 12px 0 0;background:#d9a45e;border:6px solid #a66d35;color:#fff;text-align:center;padding-top:18px;font-weight:900;letter-spacing:.08em;box-shadow:0 8px 18px #0003}.road{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(50vw,520px);height:72%;background:linear-gradient(90deg,#4f5962,#69747d 48%,#4f5962);clip-path:polygon(37% 0,63% 0,100% 100%,0 100%)}.road:after{content:"";position:absolute;left:49%;top:3%;width:2%;height:90%;background:repeating-linear-gradient(to bottom,#fff 0 18px,transparent 18px 40px);opacity:.9}.peter{--jump-y:0px;position:absolute;left:50%;bottom:8%;transform:translate(-50%,var(--jump-y));transform-origin:50% 100%;width:clamp(150px,24vw,275px);height:auto;object-fit:contain;filter:drop-shadow(0 10px 8px #0005);user-select:none;-webkit-user-drag:none;z-index:3;transition:transform 85ms linear}.peter.run{transition:none}.hurdle{position:absolute;left:50%;bottom:7%;transform:translateX(120px);width:70px;height:42px;border:8px solid #f3f5f7;border-top-width:12px;border-radius:4px;z-index:2}.controls{display:flex;justify-content:center;gap:12px;padding:12px max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom));background:#10273a}.jump{min-width:170px;padding:15px 28px;border:0;border-radius:999px;background:#ffd43b;color:#182738;font-size:20px;font-weight:950;box-shadow:0 5px 0 #c58c00}.jump:active{transform:translateY(3px);box-shadow:0 2px 0 #c58c00}.note{position:absolute;left:50%;top:30%;transform:translateX(-50%);padding:7px 10px;border-radius:999px;background:#fffbdc;color:#26384a;font-size:12px;font-weight:800;z-index:4}@media(max-width:700px){.school{width:84vw;height:15%;font-size:12px}.road{width:72vw}.peter{width:clamp(145px,39vw,230px);bottom:9%}.hurdle{transform:translateX(92px);width:55px;height:34px}}
</style>
</head>
<body>
<main class="lab">
<header class="top"><strong>SUPER ZOOS MOVEMENT LAB</strong><span id="status">RUN 1/12</span></header>
<section class="scene" id="scene"><div class="school">SUPER ZOOS SCHOOL</div><div class="road"></div><div class="note">Tap JUMP or swipe up</div><img id="peter" class="peter run" alt="Spider-Boy Peter" draggable="false"/><div class="hurdle"></div></section>
<footer class="controls"><button class="jump" id="jump">JUMP</button></footer>
</main>
<script>
const SOURCE='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter';
const runFrames=Array.from({length:12},(_,i)=>`${SOURCE}/prototype/run/run-${String(i+1).padStart(2,'0')}.png`);
const jumpFrames=Array.from({length:6},(_,i)=>`${SOURCE}/jump-test/jump-test-${String(i+1).padStart(2,'0')}.jpg`);
const jumpMs=[180,210,280,360,280,220],jumpY=[0,-34,-92,-132,-76,0];
let mode='run',runIndex=0,jumpIndex=0,queued=false,timer=null,startY=null;
const peter=document.getElementById('peter'),status=document.getElementById('status');
[...runFrames,...jumpFrames].forEach(src=>{const img=new Image();img.src=src});
function draw(){const jumping=mode==='jump';peter.src=jumping?jumpFrames[jumpIndex]:runFrames[runIndex];peter.className=`peter ${mode}`;peter.style.setProperty('--jump-y',`${jumping?jumpY[jumpIndex]:0}px`);status.textContent=jumping?`JUMP ${jumpIndex+1}/6`:`RUN ${runIndex+1}/12${queued?' · QUEUED':''}`}
function schedule(){clearTimeout(timer);draw();if(mode==='run'){timer=setTimeout(()=>{if(queued&&runIndex===0){queued=false;jumpIndex=0;mode='jump'}else runIndex=(runIndex+1)%12;schedule()},115)}else{timer=setTimeout(()=>{if(jumpIndex===5){runIndex=1;jumpIndex=0;mode='run'}else jumpIndex++;schedule()},jumpMs[jumpIndex])}}
function requestJump(){if(mode==='run'){queued=true;draw()}}
document.getElementById('jump').addEventListener('click',requestJump);
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();requestJump()}});
const scene=document.getElementById('scene');scene.addEventListener('pointerdown',e=>startY=e.clientY);scene.addEventListener('pointerup',e=>{if(startY!==null&&startY-e.clientY>28)requestJump();startY=null});scene.addEventListener('pointercancel',()=>startY=null);
schedule();
</script>
</body>
</html>
