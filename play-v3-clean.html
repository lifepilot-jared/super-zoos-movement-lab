<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>Super Zoos Movement Lab v3 Clean</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#8ed8f1;touch-action:none}.lab{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}.top{z-index:5;display:flex;justify-content:space-between;align-items:center;padding:max(10px,env(safe-area-inset-top)) 14px 10px;background:#18344a;color:#fff;font-weight:900}.top span{font-size:12px}.scene{position:relative;overflow:hidden;background:linear-gradient(#7dd3f1 0 42%,#77b75e 42% 100%)}.school{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:min(76vw,700px);height:18%;border-radius:12px 12px 0 0;background:#d9a45e;border:6px solid #a66d35;color:#fff;text-align:center;padding-top:18px;font-weight:900;letter-spacing:.08em}.road{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(50vw,520px);height:72%;background:linear-gradient(90deg,#4f5962,#69747d 48%,#4f5962);clip-path:polygon(37% 0,63% 0,100% 100%,0 100%)}.road:after{content:"";position:absolute;left:49%;top:3%;width:2%;height:90%;background:repeating-linear-gradient(to bottom,#fff 0 18px,transparent 18px 40px)}.player{--jump-y:0px;position:absolute;left:50%;bottom:8%;width:clamp(145px,22vw,220px);height:clamp(190px,28vw,280px);transform:translate(-50%,var(--jump-y));transform-origin:50% 100%;z-index:3;transition:transform 85ms linear}.player.run{transition:none}.player canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 8px 7px #0005)}.hurdle{position:absolute;left:50%;bottom:7%;transform:translateX(135px);width:70px;height:42px;border:8px solid #f3f5f7;border-top-width:12px;border-radius:4px;z-index:2}.note{position:absolute;left:50%;top:29%;transform:translateX(-50%);padding:7px 10px;border-radius:999px;background:#fffbdc;color:#26384a;font-size:12px;font-weight:800;z-index:4}.controls{display:flex;justify-content:center;padding:12px max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom));background:#10273a}.jump{min-width:170px;padding:15px 28px;border:0;border-radius:999px;background:#ffd43b;color:#182738;font-size:20px;font-weight:950;box-shadow:0 5px 0 #c58c00}.jump:active{transform:translateY(3px);box-shadow:0 2px 0 #c58c00}.loading{position:absolute;left:50%;bottom:25%;transform:translateX(-50%);padding:9px 12px;border-radius:10px;background:#18344ae8;color:#fff;font-weight:800;z-index:6;white-space:nowrap}@media(max-width:700px){.school{width:84vw;height:15%;font-size:12px}.road{width:72vw}.player{width:clamp(138px,34vw,190px);height:clamp(180px,44vw,245px);bottom:9%}.hurdle{transform:translateX(105px);width:55px;height:34px}.note{top:26%}}
</style>
</head>
<body>
<main class="lab"><header class="top"><strong>SUPER ZOOS MOVEMENT LAB v3 CLEAN</strong><span id="status">LOADING</span></header><section class="scene" id="scene"><div class="school">SUPER ZOOS SCHOOL</div><div class="road"></div><div class="note">Tap JUMP or swipe up</div><div id="player" class="player run"><canvas id="peter" width="400" height="520"></canvas></div><div id="loading" class="loading">Preparing matching frames…</div><div class="hurdle"></div></section><footer class="controls"><button class="jump" id="jump" disabled>JUMP</button></footer></main>
<script>
const BUILD='v3-clean-e1f968a';
const RUN_SOURCE='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter/prototype/run';
const runURLs=Array.from({length:12},(_,i)=>`${RUN_SOURCE}/run-${String(i+1).padStart(2,'0')}.png?${BUILD}`);
const jumpURLs=Array.from({length:6},(_,i)=>`assets/peter/jump/jump-${String(i+1).padStart(2,'0')}.png?${BUILD}`);
const jumpMs=[180,210,280,360,280,220],jumpY=[0,-26,-68,-102,-56,0];
let runFrames=[],jumpFrames=[],mode='run',runIndex=0,jumpIndex=0,queued=false,timer=null,startY=null,ready=false;
const canvas=document.getElementById('peter'),ctx=canvas.getContext('2d'),player=document.getElementById('player'),status=document.getElementById('status'),button=document.getElementById('jump'),loading=document.getElementById('loading');
function load(src){return new Promise((resolve,reject)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>resolve(i);i.onerror=reject;i.src=src;});}
function normalize(img,isRun){
 const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const d=x.getImageData(0,0,c.width,c.height).data;let minX=c.width,minY=c.height,maxX=-1,maxY=-1;
 for(let py=0;py<c.height;py++)for(let px=0;px<c.width;px++){const k=(py*c.width+px)*4,r=d[k],g=d[k+1],b=d[k+2],a=d[k+3];let keep=a>18;if(isRun){const mx=Math.max(r,g,b),mn=Math.min(r,g,b);const neutralLight=mn>188&&(mx-mn)<35;keep=keep&&!neutralLight;}if(keep){if(px<minX)minX=px;if(px>maxX)maxX=px;if(py<minY)minY=py;if(py>maxY)maxY=py;}}
 if(maxX<minX||maxY<minY)throw new Error('empty frame');
 const pad=10;minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(c.width-1,maxX+pad);maxY=Math.min(c.height-1,maxY+pad);const sw=maxX-minX+1,sh=maxY-minY+1;const out=document.createElement('canvas');out.width=400;out.height=520;const o=out.getContext('2d');const scale=Math.min(360/sw,470/sh);const dw=sw*scale,dh=sh*scale;o.drawImage(c,minX,minY,sw,sh,(400-dw)/2,500-dh,dw,dh);return out;
}
async function prepare(){try{for(let i=0;i<runURLs.length;i++){runFrames.push(normalize(await load(runURLs[i]),true));status.textContent=`RUN ${i+1}/12 READY`;}for(let i=0;i<jumpURLs.length;i++){jumpFrames.push(normalize(await load(jumpURLs[i]),false));status.textContent=`JUMP ${i+1}/6 READY`;}ready=true;loading.remove();button.disabled=false;schedule();}catch(e){loading.textContent='LOAD ERROR';status.textContent='ERROR';console.error(e);}}
function draw(){if(!ready)return;const jumping=mode==='jump';ctx.clearRect(0,0,400,520);ctx.drawImage(jumping?jumpFrames[jumpIndex]:runFrames[runIndex],0,0);player.className=`player ${mode}`;player.style.setProperty('--jump-y',`${jumping?jumpY[jumpIndex]:0}px`);status.textContent=jumping?`JUMP ${jumpIndex+1}/6`:`RUN ${runIndex+1}/12${queued?' · QUEUED':''}`;}
function schedule(){clearTimeout(timer);draw();if(mode==='run')timer=setTimeout(()=>{if(queued&&runIndex===0){queued=false;jumpIndex=0;mode='jump'}else runIndex=(runIndex+1)%12;schedule();},115);else timer=setTimeout(()=>{if(jumpIndex===5){runIndex=1;jumpIndex=0;mode='run'}else jumpIndex++;schedule();},jumpMs[jumpIndex]);}
function requestJump(){if(ready&&mode==='run'){queued=true;draw();}}
button.addEventListener('click',requestJump);window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();requestJump();}});const scene=document.getElementById('scene');scene.addEventListener('pointerdown',e=>startY=e.clientY);scene.addEventListener('pointerup',e=>{if(startY!==null&&startY-e.clientY>28)requestJump();startY=null;});scene.addEventListener('pointercancel',()=>startY=null);prepare();
</script>
</body>
</html>
