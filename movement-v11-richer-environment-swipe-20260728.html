;background:#f8f1b3;border:4px solid #4b5962}.p1{left:4%;animation-delay:-.3s}.p2{right:5%;animation-delay:-2.2s}.p3{left:15%;animation-delay:-3.4s}.p4{right:16%;animation-delay:-1.1s}@keyframes propMove{0%{transform:translateY(-15vh) scale(.45);opacity:.3}55%{opacity:1}100%{transform:translateY(88vh) scale(1.45);opacity:1}}.player{--lane-x:0px;--hop-y:0px;position:absolute;left:50%;bottom:7%;width:clamp(145px,22vw,220px);height:clamp(190px,28vw,280px);transform:translate(calc(-50% + var(--lane-x)),var(--hop-y));transform-origin:50% 100%;transition:transform 180ms ease-out;z-index:10}.player.hopping{transition:transform 30ms linear}.player canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 10px 7px #0006)}.shadow{position:absolute;left:50%;bottom:7%;width:90px;height:22px;border-radius:50%;background:#0004;transform:translateX(-50%);filter:blur(3px);z-index:8}.hint{position:absolute;left:50%;top:32%;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:#ffffffdf;color:#21374b;font-weight:850;font-size:12px;z-index:15;white-space:nowrap}.loading{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:#17364de8;color:#fff;font-weight:850;z-index:30}.laneDot{position:absolute;bottom:3%;width:9px;height:9px;border-radius:50%;background:#ffffff7d;z-index:9}.d1{left:33%}.d2{left:50%}.d3{left:67%}@media(max-width:700px){.school{width:84vw;height:20%}.school:before{font-size:11px}.road{width:112vw;height:70%;clip-path:polygon(36% 0,64% 0,100% 100%,0 100%)}.player{width:clamp(138px,34vw,190px);height:clamp(180px,44vw,245px);bottom:8%}.hint{top:29%;font-size:11px}.prop{animation-duration:4s}}</style></head><body><main class="lab"><header class="top"><strong>SUPER ZOOS MOVEMENT LAB V11 — SCROLLING SCHOOL ROAD</strong><span id="status">LOADING</span></header><section class="scene" id="scene"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="school"><div class="door"></div><div class="window w1"></div><div class="window w2"></div><div class="window w3"></div><div class="window w4"></div></div><div class="grass"></div><div class="sidewalk"></div><div class="road"><div class="dash"></div><div class="edge e1"></div><div class="edge e2"></div></div><div class="scenery"><div class="prop tree p1"></div><div class="prop tree p2"></div><div class="prop lamp p3"></div><div class="prop lamp p4"></div></div><div class="hint">Swipe ← → to change lane · Swipe ↑ to hop</div><div class="shadow" id="shadow"></div><div class="laneDot d1"></div><div class="laneDot d2"></div><div class="laneDot d3"></div><div id="player" class="player"><canvas id="peter" width="400" height="520"></canvas></div><div id="loading" class="loading">Preparing Spider-Boy…</div></section></main><script>const BUILD='v11-rich-env-20260728';const RUN_SOURCE='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter/prototype/run';const runURLs=Array.from({length:12},(_,i)=>`${RUN_SOURCE}/run-${String(i+1).padStart(2,'0')}.png?${BUILD}`);let frames=[],runIndex=0,ready=false,hopping=false,timer=null,startX=0,startY=0,lane=1;const canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),player=document.getElementById('player'),shadow=document.getElementById('shadow'),status=document.getElementById('status'),loading=document.getElementById('loading'),scene=document.getElementById('scene');function load(src){return new Promise((resolve,reject)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}function isolate(img){const max=720,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true,alpha:true});x.drawImage(img,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data,mask=new Uint8Array(w*h);for(let p=0,k=0;p<mask.length;p++,k+=4){const r=d[k],g=d[k+1],b=d[k+2],a=d[k+3],red=r>48&&r>g*1.18&&r>b*1.08,dark=r<145&&g<145&&b<145;mask[p]=a>20&&(red||dark)?1:0}const seen=new Uint8Array(w*h);let win=null,best=-1;for(let p=0;p<mask.length;p++){if(!mask[p]||seen[p])continue;const st=[p],comp=[];seen[p]=1;let sx=0,sy=0;while(st.length){const q=st.pop(),qx=q%w,qy=q/w|0;comp.push(q);sx+=qx;sy+=qy;if(qx>0&&mask[q-1]&&!seen[q-1]){seen[q-1]=1;st.push(q-1)}if(qx<w-1&&mask[q+1]&&!seen[q+1]){seen[q+1]=1;st.push(q+1)}if(qy>0&&mask[q-w]&&!seen[q-w]){seen[q-w]=1;st.push(q-w)}if(qy<h-1&&mask[q+w]&&!seen[q+w]){seen[q+w]=1;st.push(q+w)}}const cx=sx/comp.length,cy=sy/comp.length,dist=Math.hypot((cx-w/2)/w,(cy-h*.58)/h),score=comp.length/(1+3*dist);if(comp.length>120&&score>best){best=score;win=comp}}if(!win)throw new Error('run component missing');const keep=new Uint8Array(w*h);for(const p of win)keep[p]=1;let minX=w,minY=h,maxX=-1,maxY=-1;for(let p=0;p<keep.length;p++){const k=p*4;if(!keep[p]){d[k+3]=0;continue}const px=p%w,py=p/w|0;if(px<minX)minX=px;if(px>maxX)maxX=px;if(py<minY)minY=py;if(py>maxY)maxY=py}x.putImageData(im,0,0);const pad=8;minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w-1,maxX+pad);maxY=Math.min(h-1,maxY+pad);const sw=maxX-minX+1,sh=maxY-minY+1,out=document.createElement('canvas');out.width=400;out.height=520;const o=out.getContext('2d',{alpha:true}),scale=Math.min(330/sw,430/sh),dw=sw*scale,dh=sh*scale;o.drawImage(c,minX,minY,sw,sh,(400-dw)/2,500-dh,dw,dh);return out}async function prepare(){try{for(let i=0;i<12;i++){frames.push(isolate(await load(runURLs[i])));status.textContent=`RUN ${i+1}/12 READY`}ready=true;loading.remove();schedule();setLane()}catch(e){loading.textContent='LOAD ERROR';status.textContent='ERROR';console.error(e)}}function draw(frame=frames[runIndex]){ctx.clearRect(0,0,400,520);ctx.drawImage(frame,0,0)}function schedule(){clearTimeout(timer);if(!ready||hopping)return;draw();status.textContent=`LANE ${lane+1} · RUN ${runIndex+1}/12`;timer=setTimeout(()=>{runIndex=(runIndex+1)%12;schedule()},115)}function laneOffset(){const width=Math.min(innerWidth*.24,220);return(lane-1)*width}function setLane(){player.style.setProperty('--lane-x',`${laneOffset()}px`);shadow.style.transform=`translateX(calc(-50% + ${laneOffset()}px))`}function moveLane(dir){lane=Math.max(0,Math.min(2,lane+dir));setLane();status.textContent=`LANE ${lane+1}`}function hop(){if(!ready||hopping)return;hopping=true;clearTimeout(timer);player.classList.add('hopping');const frozen=frames[0],duration=760,height=125,start=performance.now();function step(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop-y',`${y}px`);shadow.style.opacity=`${.42-.27*Math.sin(Math.PI*t)}`;shadow.style.transform=`translateX(calc(-50% + ${laneOffset()}px)) scale(${1-.28*Math.sin(Math.PI*t)})`;draw(frozen);status.textContent=`HOP ${Math.round(t*100)}%`;if(t<1)requestAnimationFrame(step);else{player.style.setProperty('--hop-y','0px');player.classList.remove('hopping');shadow.style.opacity='.42';setLane();hopping=false;runIndex=1;schedule()}}requestAnimationFrame(step)}scene.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});scene.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;if(Math.abs(dy)>Math.abs(dx)&&dy<-30)hop();else if(Math.abs(dx)>Math.abs(dy))moveLane(dx>0?1:-1)});scene.addEventListener('pointercancel',()=>{});window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft')moveLane(-1);if(e.code==='ArrowRight')moveLane(1);if(e.code==='ArrowUp'||e.code==='Space'){e.preventDefault();hop()}});window.addEventListener('resize',setLane);prepare()</script></body></html>
