<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store"><title>Super Zoos Movement Lab V10 Wide Road</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#91d8f3;touch-action:none}.lab{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#18344a;color:#fff;font-weight:900;z-index:10}.top span{font-size:12px}.scene{position:relative;overflow:hidden;background:linear-gradient(#83d8f3 0 35%,#84be6b 35% 100%)}.hills{position:absolute;left:-5%;right:-5%;top:24%;height:18%;background:linear-gradient(145deg,#6ca456 0 33%,transparent 33%),linear-gradient(215deg,#74ad5b 0 34%,transparent 34%);opacity:.95}.school{position:absolute;top:5%;left:50%;transform:translateX(-50%);width:min(72vw,720px);height:16%;border-radius:18px 18px 2px 2px;background:#d9a45e;border:6px solid #a66d35;color:#fff;text-align:center;padding-top:14px;font-weight:950;letter-spacing:.08em;box-shadow:0 8px 16px #0002}.road{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);width:min(94vw,980px);height:76%;background:linear-gradient(90deg,#505861,#68737d 18%,#727d87 50%,#68737d 82%,#505861);clip-path:polygon(27% 0,73% 0,100% 100%,0 100%);border-bottom:10px solid #424a52}.road:before,.road:after{content:"";position:absolute;top:2%;height:96%;width:1.2%;background:repeating-linear-gradient(to bottom,#f7f7f7 0 22px,transparent 22px 50px);opacity:.9}.road:before{left:37%}.road:after{right:37%}.kerb{position:absolute;bottom:0;width:10%;height:75%;background:repeating-linear-gradient(to bottom,#f0f0f0 0 36px,#d95a54 36px 72px);opacity:.9}.kerb.left{left:0;clip-path:polygon(0 0,100% 35%,100% 100%,0 100%)}.kerb.right{right:0;clip-path:polygon(100% 0,0 35%,0 100%,100% 100%)}.lane-label{position:absolute;bottom:4%;font-size:11px;font-weight:900;color:#fff9;letter-spacing:.08em}.lane-label.l{left:18%}.lane-label.c{left:50%;transform:translateX(-50%)}.lane-label.r{right:18%}.player{--hop-y:0px;--lane-x:0px;position:absolute;left:50%;bottom:7%;width:clamp(145px,22vw,220px);height:clamp(190px,28vw,280px);transform:translate(calc(-50% + var(--lane-x)),var(--hop-y));transform-origin:50% 100%;transition:transform 260ms cubic-bezier(.2,.8,.2,1);z-index:5;background:transparent}.player.hopping{transition:transform 40ms linear}.player canvas{display:block;width:100%;height:100%;background:transparent;filter:drop-shadow(0 8px 7px #0005)}.note{position:absolute;left:50%;top:23%;transform:translateX(-50%);padding:7px 11px;border-radius:999px;background:#fffbdc;color:#26384a;font-size:12px;font-weight:800;z-index:7;white-space:nowrap}.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom));background:#10273a}.move-group{display:flex;gap:8px}.move-group.right{justify-content:flex-end}.btn{min-width:64px;padding:13px 16px;border:0;border-radius:16px;background:#e7eef4;color:#18344a;font-size:18px;font-weight:950;box-shadow:0 4px 0 #9aa8b5}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9aa8b5}.jump{min-width:150px;border-radius:999px;background:#ffd43b;box-shadow:0 5px 0 #c58c00}.jump:active{box-shadow:0 2px 0 #c58c00}.loading{position:absolute;left:50%;bottom:25%;transform:translateX(-50%);padding:9px 12px;border-radius:10px;background:#18344ae8;color:#fff;font-weight:800;z-index:8;white-space:nowrap}@media(max-width:700px){.school{width:84vw;height:14%;font-size:12px}.road{width:98vw;height:78%;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}.road:before{left:35%}.road:after{right:35%}.player{width:clamp(138px,34vw,190px);height:clamp(180px,44vw,245px);bottom:8%}.note{top:21%;font-size:11px}.controls{grid-template-columns:auto 1fr auto}.jump{min-width:120px}.btn{min-width:58px;padding:12px 14px}}</style></head><body><main class="lab"><header class="top"><strong>SUPER ZOOS MOVEMENT LAB V10 — WIDE ROAD</strong><span id="status">LOADING</span></header><section class="scene" id="scene"><div class="hills"></div><div class="school">SUPER ZOOS SCHOOL</div><div class="road"><div class="kerb left"></div><div class="kerb right"></div><span class="lane-label l">LEFT</span><span class="lane-label c">CENTRE</span><span class="lane-label r">RIGHT</span></div><div class="note">Swipe left/right to change lane · swipe up to hop</div><div id="player" class="player"><canvas id="peter" width="400" height="520"></canvas></div><div id="loading" class="loading">Preparing run frames…</div></section><footer class="controls"><div class="move-group"><button class="btn" id="left" aria-label="Move left">◀</button></div><button class="btn jump" id="jump" disabled>HOP</button><div class="move-group right"><button class="btn" id="right" aria-label="Move right">▶</button></div></footer></main><script>const BUILD='v10-wide-road-20260728';const RUN_SOURCE='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter/prototype/run';const runURLs=Array.from({length:12},(_,i)=>`${RUN_SOURCE}/run-${String(i+1).padStart(2,'0')}.png?${BUILD}`);let runFrames=[],runIndex=0,ready=false,hopping=false,timer=null,startX=null,startY=null,lane=1;const canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),player=document.getElementById('player'),status=document.getElementById('status'),jumpButton=document.getElementById('jump'),loading=document.getElementById('loading');function load(src){return new Promise((resolve,reject)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}function isolateRun(img){const max=720,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true,alpha:true});x.drawImage(img,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data,mask=new Uint8Array(w*h);for(let p=0,k=0;p<mask.length;p++,k+=4){const r=d[k],g=d[k+1],b=d[k+2],a=d[k+3],red=r>48&&r>g*1.18&&r>b*1.08,dark=r<145&&g<145&&b<145;mask[p]=a>20&&(red||dark)?1:0}const seen=new Uint8Array(w*h);let winner=null,best=-1;for(let p=0;p<mask.length;p++){if(!mask[p]||seen[p])continue;const st=[p],comp=[];seen[p]=1;let sx=0,sy=0;while(st.length){const q=st.pop(),qx=q%w,qy=q/w|0;comp.push(q);sx+=qx;sy+=qy;if(qx>0&&mask[q-1]&&!seen[q-1]){seen[q-1]=1;st.push(q-1)}if(qx<w-1&&mask[q+1]&&!seen[q+1]){seen[q+1]=1;st.push(q+1)}if(qy>0&&mask[q-w]&&!seen[q-w]){seen[q-w]=1;st.push(q-w)}if(qy<h-1&&mask[q+w]&&!seen[q+w]){seen[q+w]=1;st.push(q+w)}}const cx=sx/comp.length,cy=sy/comp.length,dist=Math.hypot((cx-w/2)/w,(cy-h*.58)/h),score=comp.length/(1+3*dist);if(comp.length>120&&score>best){best=score;winner=comp}}if(!winner)throw new Error('run component missing');const keep=new Uint8Array(w*h);for(const p of winner)keep[p]=1;let minX=w,minY=h,maxX=-1,maxY=-1;for(let p=0;p<keep.length;p++){const k=p*4;if(!keep[p]){d[k+3]=0;continue}const px=p%w,py=p/w|0;if(px<minX)minX=px;if(px>maxX)maxX=px;if(py<minY)minY=py;if(py>maxY)maxY=py}x.putImageData(im,0,0);const pad=8;minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w-1,maxX+pad);maxY=Math.min(h-1,maxY+pad);const sw=maxX-minX+1,sh=maxY-minY+1,out=document.createElement('canvas');out.width=400;out.height=520;const o=out.getContext('2d',{alpha:true}),scale=Math.min(330/sw,430/sh),dw=sw*scale,dh=sh*scale;o.drawImage(c,minX,minY,sw,sh,(400-dw)/2,500-dh,dw,dh);return out}async function prepare(){try{for(let i=0;i<12;i++){runFrames.push(isolateRun(await load(runURLs[i])));status.textContent=`RUN ${i+1}/12 READY`}ready=true;loading.remove();jumpButton.disabled=false;applyLane();schedule()}catch(e){loading.textContent='LOAD ERROR';status.textContent='ERROR';console.error(e)}}function laneOffset(){const max=Math.min(window.innerWidth*.27,250);return[-max,0,max][lane]}function applyLane(){player.style.setProperty('--lane-x',`${laneOffset()}px`);status.textContent=`LANE ${['LEFT','CENTRE','RIGHT'][lane]}`}function draw(frame=runFrames[runIndex]){ctx.clearRect(0,0,400,520);ctx.drawImage(frame,0,0)}function schedule(){clearTimeout(timer);if(!ready)return;if(!hopping){draw();status.textContent=`RUN ${runIndex+1}/12 · ${['LEFT','CENTRE','RIGHT'][lane]}`;timer=setTimeout(()=>{runIndex=(runIndex+1)%12;schedule()},115)}}function move(delta){if(!ready)return;lane=Math.max(0,Math.min(2,lane+delta));applyLane()}function requestHop(){if(!ready||hopping)return;hopping=true;clearTimeout(timer);player.classList.add('hopping');const frozen=runFrames[0],duration=760,height=118,start=performance.now();function hop(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop-y',`${y}px`);draw(frozen);status.textContent=`HOP ${Math.round(t*100)}% · ${['LEFT','CENTRE','RIGHT'][lane]}`;if(t<1)requestAnimationFrame(hop);else{player.style.setProperty('--hop-y','0px');player.classList.remove('hopping');hopping=false;runIndex=1;schedule()}}requestAnimationFrame(hop)}document.getElementById('left').addEventListener('click',()=>move(-1));document.getElementById('right').addEventListener('click',()=>move(1));jumpButton.addEventListener('click',requestHop);window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.code==='ArrowRight'){e.preventDefault();move(1)}else if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();requestHop()}});const scene=document.getElementById('scene');scene.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});scene.addEventListener('pointerup',e=>{if(startX===null)return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>35)move(dx>0?1:-1);else if(dy<-35)requestHop();startX=startY=null});scene.addEventListener('pointercancel',()=>{startX=startY=null});window.addEventListener('resize',applyLane);prepare()</script></body></html>
