r" id="player"><canvas id="peter" width="400" height="520"></canvas></div><div class="loading" id="loading">Preparing Spider-Boy…</div><div class="finish" id="finish">PETER MADE IT TO SCHOOL!<br><button id="restart">RUN AGAIN</button></div></section></main><script>const BUILD='v24-true-environment-advance',RUN='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter/prototype/run',urls=Array.from({length:12},(_,i)=>`${RUN}/run-${String(i+1).padStart(2,'0')}.png?${BUILD}`);let frames=[],idx=0,lane=1,ready=false,hopping=false,sliding=false,timer,startX=0,startY=0,progress=0,runStart=0,finished=false,lastMotion=0,motionPhase=0;const SLIDE_MS=210,RUN_MS=24000;const canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),player=document.getElementById('player'),shadow=document.getElementById('shadow'),status=document.getElementById('status'),loading=document.getElementById('loading'),scene=document.getElementById('scene'),bar=document.getElementById('bar'),distance=document.getElementById('distance'),finish=document.getElementById('finish'),motionCanvas=document.getElementById('worldMotion'),mctx=motionCanvas.getContext('2d'),environment=document.getElementById('environment'),environmentBack=document.getElementById('environmentBack');function resizeMotion(){const dpr=Math.min(2,devicePixelRatio||1),r=scene.getBoundingClientRect();motionCanvas.width=Math.round(r.width*dpr);motionCanvas.height=Math.round(r.height*dpr);motionCanvas.style.width=r.width+'px';motionCanvas.style.height=r.height+'px';mctx.setTransform(dpr,0,0,dpr,0,0)}function drawWorldMotion(now){const r=scene.getBoundingClientRect(),w=r.width,h=r.height;if(!lastMotion)lastMotion=now;const dt=Math.min(40,now-lastMotion);lastMotion=now;if(!finished)motionPhase=(motionPhase+dt*.00055)%1;mctx.clearRect(0,0,w,h);const horizonY=h*.285,bottomY=h*1.05,center=w*.5,topHalf=w*.045,bottomHalf=w*.39;for(const side of[-1,1])for(let i=0;i<12;i++){const t=(motionPhase+i/12)%1,e=t*t,y=horizonY+(bottomY-horizonY)*e,half=topHalf+(bottomHalf-topHalf)*e,x=center+side*half*.36,dw=2+12*e,dh=6+78*e;mctx.fillStyle=`rgba(255,255,255,${.08+.65*e})`;mctx.fillRect(x-dw/2,y-dh/2,dw,dh)}for(const side of[-1,1])for(let i=0;i<7;i++){const t=(motionPhase*.78+i/7)%1,e=t*t,y=horizonY+(bottomY-horizonY)*e,half=topHalf+(bottomHalf-topHalf)*e,x=center+side*(half+20+92*e),ph=10+100*e,pw=2+7*e;mctx.fillStyle=`rgba(30,50,62,${.18+.62*e})`;mctx.fillRect(x-pw/2,y-ph,pw,ph);mctx.beginPath();mctx.arc(x,y-ph,2+8*e,0,Math.PI*2);mctx.fillStyle=`rgba(255,236,145,${.18+.72*e})`;mctx.fill()}requestAnimationFrame(drawWorldMotion)}function load(src){return new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}function isolate(img){const s=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data,m=new Uint8Array(w*h);for(let p=0,k=0;p<m.length;p++,k+=4){const r=d[k],g=d[k+1],b=d[k+2],a=d[k+3];m[p]=a>20&&((r>48&&r>g*1.18&&r>b*1.08)||(r<145&&g<145&&b<145))?1:0}const seen=new Uint8Array(m.length);let win,best=-1;for(let p=0;p<m.length;p++){if(!m[p]||seen[p])continue;const st=[p],comp=[];seen[p]=1;let sx=0,sy=0;while(st.length){const q=st.pop(),qx=q%w,qy=q/w|0;comp.push(q);sx+=qx;sy+=qy;for(const n of[qx>0?q-1:-1,qx<w-1?q+1:-1,qy>0?q-w:-1,qy<h-1?q+w:-1])if(n>=0&&m[n]&&!seen[n]){seen[n]=1;st.push(n)}}const cx=sx/comp.length,cy=sy/comp.length,dist=Math.hypot((cx-w/2)/w,(cy-h*.58)/h),sc=comp.length/(1+3*dist);if(comp.length>120&&sc>best){best=sc;win=comp}}if(!win)throw Error('run component missing');const keep=new Uint8Array(m.length);for(const p of win)keep[p]=1;let minX=w,minY=h,maxX=0,maxY=0;for(let p=0;p<keep.length;p++){const k=p*4;if(!keep[p])d[k+3]=0;else{const px=p%w,py=p/w|0;minX=Math.min(minX,px);maxX=Math.max(maxX,px);minY=Math.min(minY,py);maxY=Math.max(maxY,py)}}x.putImageData(im,0,0);const pad=8,sx=Math.max(0,minX-pad),sy=Math.max(0,minY-pad),sw=Math.min(w-sx,maxX-minX+1+pad*2),sh=Math.min(h-sy,maxY-minY+1+pad*2),out=document.createElement('canvas');out.width=400;out.height=520;const o=out.getContext('2d'),scale=Math.min(330/sw,430/sh),dw=sw*scale,dh=sh*scale;o.drawImage(c,sx,sy,sw,sh,(400-dw)/2,500-dh,dw,dh);return out}async function prep(){try{for(let i=0;i<12;i++){frames.push(isolate(await load(urls[i])));status.textContent=`RUN ${i+1}/12`}ready=true;loading.remove();setLane(false);restartRun();loop()}catch(e){loading.textContent='LOAD ERROR';status.textContent='ERROR';console.error(e)}}function draw(f=frames[idx]){ctx.clearRect(0,0,400,520);ctx.drawImage(f,0,0)}function loop(){clearTimeout(timer);if(!ready||hopping||finished)return;draw();status.textContent=`LANE ${lane+1}`;timer=setTimeout(()=>{idx=(idx+1)%12;loop()},115)}function laneCenters(){const w=scene.getBoundingClientRect().width;return[-w*.355,0,w*.355]}function setLane(animate=true){const x=laneCenters()[lane];if(!animate){player.style.transition='none';shadow.style.transition='none'}player.style.setProperty('--lane',`${x}px`);shadow.style.transform=`translateX(calc(-50% + ${x}px))`;if(!animate)requestAnimationFrame(()=>{player.style.transition=`transform ${SLIDE_MS}ms cubic-bezier(.22,.75,.25,1)`;shadow.style.transition=`transform ${SLIDE_MS}ms cubic-bezier(.22,.75,.25,1)`})}function move(d){if(!ready||hopping||sliding||finished)return;const next=Math.max(0,Math.min(2,lane+d));if(next===lane)return;lane=next;sliding=true;setLane(true);setTimeout(()=>sliding=false,SLIDE_MS+20)}function hop(){if(!ready||hopping||sliding||finished)return;hopping=true;clearTimeout(timer);player.classList.add('hopping');const frozen=frames[0],duration=760,height=132,start=performance.now();function step(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop',`${y}px`);draw(frozen);if(t<1)requestAnimationFrame(step);else{player.style.setProperty('--hop','0px');player.classList.remove('hopping');hopping=false;idx=1;loop()}}requestAnimationFrame(step)}function applyEnvironmentAdvance(p,now){const pulse=Math.sin(now*.004)*.003;const scale=1+p*.34+pulse;const rise=p*2.8;environment.style.transform=`translateY(${rise}%) scale(${scale})`;environmentBack.style.transform=`translateY(${rise*.7}%) scale(${1.06+p*.28+pulse*.6})`;environment.style.filter=`saturate(${1+p*.08}) brightness(${1-p*.05})`}function restartRun(){finished=false;progress=0;runStart=performance.now();finish.style.display='none';environment.style.transform='translateY(0) scale(1)';environmentBack.style.transform='scale(1.06)';requestAnimationFrame(updateProgress)}function updateProgress(now){if(finished)return;progress=Math.min(1,(now-runStart)/RUN_MS);bar.style.width=`${progress*100}%`;distance.textContent=`${Math.max(0,Math.ceil(300*(1-progress)))} m`;applyEnvironmentAdvance(progress,now);if(progress>=1){finished=true;clearTimeout(timer);status.textContent='ARRIVED';finish.style.display='block';draw(frames[0]);return}requestAnimationFrame(updateProgress)}scene.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});scene.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;if(Math.abs(dy)>Math.abs(dx)&&dy<0)hop();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1)});document.getElementById('restart').onclick=()=>{idx=0;loop();restartRun()};addEventListener('resize',()=>{setLane(false);resizeMotion()});resizeMotion();requestAnimationFrame(drawWorldMotion);prep()</script></body></html>
