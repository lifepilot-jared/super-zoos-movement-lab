%;background:linear-gradient(90deg,#174d6b 48%,#d9eff7 49% 51%,#174d6b 52%);border:4px solid #693c22}.roadWrap{position:absolute;inset:39% 0 0;z-index:4;overflow:hidden}.grassL,.grassR,.walkL,.walkR,.road{position:absolute;inset:0}.grassL{background:linear-gradient(90deg,#5ea84e,#8bcc67);clip-path:polygon(0 0,43.7% 0,0 100%)}.grassR{background:linear-gradient(90deg,#8bcc67,#5ea84e);clip-path:polygon(56.3% 0,100% 0,100% 100%)}.walkL{background:repeating-linear-gradient(165deg,#cfd1c9 0 32px,#b7bbb4 33px 35px);clip-path:polygon(42% 0,45.4% 0,12% 100%,0 100%)}.walkR{background:repeating-linear-gradient(15deg,#cfd1c9 0 32px,#b7bbb4 33px 35px);clip-path:polygon(54.6% 0,58% 0,100% 100%,88% 100%)}.road{background:linear-gradient(90deg,#202831,#39424b 48%,#202831);clip-path:polygon(45.2% 0,54.8% 0,88.5% 100%,11.5% 100%);box-shadow:inset 0 0 30px #0008}.kerbL,.kerbR{position:absolute;top:0;bottom:0;width:100%;z-index:6}.kerbL{background:linear-gradient(90deg,#f6cf39,#fff2a5);clip-path:polygon(44.5% 0,45.2% 0,12% 100%,9.6% 100%)}.kerbR{background:linear-gradient(90deg,#fff2a5,#f6cf39);clip-path:polygon(54.8% 0,55.5% 0,90.4% 100%,88% 100%)}.marker,.roadObject{position:absolute;left:50%;top:0;z-index:7;will-change:transform,opacity}.marker{width:8px;height:42px;border-radius:3px;background:#f7f7f1;box-shadow:0 2px 3px #0005}.roadObject{width:70px;height:120px;transform-origin:50% 100%}.tree .crown{position:absolute;left:7px;top:0;width:56px;height:63px;border-radius:48% 52% 46% 54%;background:radial-gradient(circle at 35% 26%,#a9e36c,#2c873f 68%,#17612e);box-shadow:-13px 10px 0 -4px #3d9948,14px 12px 0 -5px #2d823d}.tree .trunk{position:absolute;left:30px;bottom:0;width:12px;height:61px;background:linear-gradient(90deg,#713e21,#a86936,#59301e);border-radius:6px}.lamp .post{position:absolute;left:32px;top:22px;width:7px;height:93px;background:linear-gradient(90deg,#102939,#35566a,#102939)}.lamp .head{position:absolute;left:17px;top:0;width:37px;height:31px;background:#173447;border:4px solid #0b2232;clip-path:polygon(12% 0,88% 0,100% 100%,0 100%)}.lamp .glow{position:absolute;left:23px;top:8px;width:25px;height:17px;background:#fff0a2;filter:drop-shadow(0 0 7px #ffd85b)}.banner{position:absolute;left:39px;top:36px;width:38px;height:55px;background:#0b4d7a;border:2px solid #f3c53b;color:#ffd64a;font-size:8px;font-weight:950;text-align:center;padding-top:11px;transform:skewY(-4deg)}.banner:after{content:"★";display:block;font-size:17px}.shadow{position:absolute;left:50%;bottom:1.2%;width:170px;height:30px;border-radius:50%;background:#0005;filter:blur(5px);transform:translateX(-50%);transition:transform 210ms cubic-bezier(.22,.75,.25,1);z-index:28}.player{--lane:0px;--hop:0px;position:absolute;left:50%;bottom:-1%;width:clamp(270px,42vw,370px);height:clamp(350px,53vw,480px);transform:translate(calc(-50% + var(--lane)),var(--hop));transform-origin:50% 100%;transition:transform 210ms cubic-bezier(.22,.75,.25,1);z-index:30}.player.hopping{transition:transform 30ms linear}.player canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 15px 11px #0008)}.hint{position:absolute;left:50%;top:3%;transform:translateX(-50%);padding:8px 14px;border-radius:16px;background:#17364ddd;color:#fff;font-size:11px;font-weight:900;text-align:center;z-index:50;white-space:nowrap}.loading,.finish{position:absolute;left:50%;transform:translateX(-50%);padding:12px 17px;border-radius:14px;background:#102f48ee;color:#fff;font-weight:950;z-index:90}.loading{bottom:24%}.finish{top:35%;display:none;text-align:center}.finish button{margin-top:12px;border:0;border-radius:999px;padding:10px 18px;background:#ffe052;color:#14314a;font-weight:950}@media(max-width:700px){.game{grid-template-rows:94px 1fr}.hud{grid-template-columns:1fr minmax(160px,44vw) 1fr;gap:8px}.title{font-size:13px}.status{font-size:12px}.player{width:clamp(260px,63vw,350px);height:clamp(338px,80vw,455px)}.hint{font-size:10px}.school{width:215px;height:135px}}</style></head><body><main class="game"><header class="hud"><div class="title">SUPER ZOOS<br>SCHOOL RUN</div><div class="progressWrap"><div class="progressLabel">DISTANCE TO SCHOOL</div><div class="track"><div class="bar" id="bar"></div></div><div class="distance" id="distance">520 m</div></div><div class="status" id="status">LOADING</div></header><section class="scene" id="scene"><div class="cloud c1"></div><div class="cloud c2"></div><div class="hills"></div><div class="town"><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div><div class="block"></div></div><div class="school" id="school"><div class="schoolTower"><div class="clock"></div></div><div class="schoolRoof"></div><div class="schoolMain"><div class="sign">SUPER ZOOS SCHOOL</div><div class="doors"></div></div></div><div class="roadWrap"><div class="grassL"></div><div class="grassR"></div><div class="walkL"></div><div class="walkR"></div><div class="road"></div><div class="kerbL"></div><div class="kerbR"></div><div id="markers"></div><div id="objects"></div></div><div class="hint">PHASE 3C · TRUE LAYERED ENVIRONMENT<br>SWIPE ← → TO CHANGE LANES · SWIPE ↑ TO HOP</div><div class="shadow" id="shadow"></div><div class="player" id="player"><canvas id="peter" width="400" height="520"></canvas></div><div class="loading" id="loading">Preparing Spider-Boy…</div><div class="finish" id="finish">PETER REACHED THE SCHOOL GATES!<br><button id="restart">RUN AGAIN</button></div></section></main><script>const BUILD='v27-layered',RUN='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter/prototype/run',urls=Array.from({length:12},(_,i)=>`${RUN}/run-${String(i+1).padStart(2,'0')}.png?${BUILD}`);const RUN_MS=56000,FRAME_MS=155,SLIDE_MS=210,HORIZON=.02;let frames=[],idx=0,lane=1,ready=false,hopping=false,sliding=false,timer,startX=0,startY=0,progress=0,runStart=0,finished=false,raf=0;const canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),player=document.getElementById('player'),shadow=document.getElementById('shadow'),status=document.getElementById('status'),loading=document.getElementById('loading'),scene=document.getElementById('scene'),bar=document.getElementById('bar'),distance=document.getElementById('distance'),finish=document.getElementById('finish'),school=document.getElementById('school'),markersHost=document.getElementById('markers'),objectsHost=document.getElementById('objects');function load(src){return new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}function isolate(img){const s=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data,m=new Uint8Array(w*h);for(let p=0,k=0;p<m.length;p++,k+=4){const r=d[k],g=d[k+1],b=d[k+2],a=d[k+3];m[p]=a>20&&((r>48&&r>g*1.18&&r>b*1.08)||(r<145&&g<145&&b<145))?1:0}const seen=new Uint8Array(m.length);let win,best=-1;for(let p=0;p<m.length;p++){if(!m[p]||seen[p])continue;const st=[p],comp=[];seen[p]=1;let sx=0,sy=0;while(st.length){const q=st.pop(),qx=q%w,qy=q/w|0;comp.push(q);sx+=qx;sy+=qy;for(const n of [qx>0?q-1:-1,qx<w-1?q+1:-1,qy>0?q-w:-1,qy<h-1?q+w:-1])if(n>=0&&m[n]&&!seen[n]){seen[n]=1;st.push(n)}}const cx=sx/comp.length,cy=sy/comp.length,dist=Math.hypot((cx-w/2)/w,(cy-h*.58)/h),sc=comp.length/(1+3*dist);if(comp.length>120&&sc>best){best=sc;win=comp}}if(!win)throw Error('run component missing');const keep=new Uint8Array(m.length);for(const p of win)keep[p]=1;let minX=w,minY=h,maxX=0,maxY=0;for(let p=0;p<keep.length;p++){const k=p*4;if(!keep[p])d[k+3]=0;else{const px=p%w,py=p/w|0;minX=Math.min(minX,px);maxX=Math.max(maxX,px);minY=Math.min(minY,py);maxY=Math.max(maxY,py)}}x.putImageData(im,0,0);const pad=8,sx=Math.max(0,minX-pad),sy=Math.max(0,minY-pad),sw=Math.min(w-sx,maxX-minX+1+pad*2),sh=Math.min(h-sy,maxY-minY+1+pad*2),out=document.createElement('canvas');out.width=400;out.height=520;const o=out.getContext('2d'),scale=Math.min(330/sw,430/sh),dw=sw*scale,dh=sh*scale;o.drawImage(c,sx,sy,sw,sh,(400-dw)/2,500-dh,dw,dh);return out}async function prep(){try{for(let i=0;i<12;i++){frames.push(isolate(await load(urls[i])));status.textContent=`RUN ${i+1}/12`}ready=true;loading.remove();buildWorld();setLane(false);restartRun();runLoop()}catch(e){loading.textContent='LOAD ERROR';status.textContent='ERROR';console.error(e)}}function draw(f=frames[idx]){ctx.clearRect(0,0,400,520);ctx.drawImage(f,0,0)}function runLoop(){clearTimeout(timer);if(!ready||hopping||finished)return;draw();status.textContent=`LANE ${lane+1} · RUN ${idx+1}/12`;timer=setTimeout(()=>{idx=(idx+1)%12;runLoop()},FRAME_MS)}function laneCenters(){const w=scene.getBoundingClientRect().width;return[-w*.31,0,w*.31]}function setLane(animate=true){const x=laneCenters()[lane];if(!animate){player.style.transition='none';shadow.style.transition='none'}player.style.setProperty('--lane',`${x}px`);shadow.style.transform=`translateX(calc(-50% + ${x}px))`;if(!animate)requestAnimationFrame(()=>{player.style.transition=`transform ${SLIDE_MS}ms cubic-bezier(.22,.75,.25,1)`;shadow.style.transition=`transform ${SLIDE_MS}ms cubic-bezier(.22,.75,.25,1)`})}function move(d){if(!ready||hopping||sliding||finished)return;const next=Math.max(0,Math.min(2,lane+d));if(next===lane)return;lane=next;sliding=true;setLane(true);setTimeout(()=>sliding=false,SLIDE_MS+20)}function hop(){if(!ready||hopping||sliding||finished)return;hopping=true;clearTimeout(timer);player.classList.add('hopping');const frozen=frames[idx],duration=760,height=132,start=performance.now();function step(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop',`${y}px`);draw(frozen);if(t<1)requestAnimationFrame(step);else{player.style.setProperty('--hop','0px');player.classList.remove('hopping');hopping=false;idx=(idx+1)%12;runLoop()}}requestAnimationFrame(step)}const markers=[],objects=[];function buildWorld(){markersHost.innerHTML='';objectsHost.innerHTML='';for(let laneLine=0;laneLine<2;laneLine++)for(let i=0;i<16;i++){const el=document.createElement('div');el.className='marker';markersHost.appendChild(el);markers.push({el,laneLine,z:(i/16+laneLine*.025)%1})}for(let side of[-1,1])for(let i=0;i<11;i++){const el=document.createElement('div'),kind=i%2?'lamp':'tree';el.className=`roadObject ${kind}`;el.innerHTML=kind==='tree'?'<div class="crown"></div><div class="trunk"></div>':'<div class="head"></div><div class="glow"></div><div class="post"></div><div class="banner">SUPER<br>ZOOS</div>';objectsHost.appendChild(el);objects.push({el,side,z:(i/11+(side>0?.045:0))%1,offset:1.03+(i%3)*.08})}}function easeRoad(z){return z*z}function renderWorld(t){const w=scene.clientWidth,h=scene.clientHeight,roadTop=h*.39,roadH=h-roadTop;for(const m of markers){let z=(m.z+t*1.95)%1;const q=easeRoad(z),y=roadTop+q*roadH,half=w*(.048+.337*q),x=w/2+(m.laneLine?1:-1)*half*.34,sc=.18+q*1.65;m.el.style.transform=`translate(${x-4}px,${y}px) scale(${sc})`;m.el.style.opacity=Math.min(1,q*3)}for(const o of objects){let z=(o.z+t*1.12)%1;const q=easeRoad(z),y=roadTop+q*roadH,half=w*(.055+.47*q),x=w/2+o.side*half*o.offset,sc=.13+q*1.55;o.el.style.transform=`translate(${x-35}px,${y-120}px) scale(${sc})`;o.el.style.opacity=Math.min(1,q*3.2)}}function restartRun(){cancelAnimationFrame(raf);finished=false;progress=0;runStart=performance.now();finish.style.display='none';school.style.transform='translate(-50%,-50%) scale(.36)';school.style.top='31%';raf=requestAnimationFrame(updateWorld)}function updateWorld(now){if(finished)return;progress=Math.min(1,(now-runStart)/RUN_MS);bar.style.width=`${progress*100}%`;distance.textContent=`${Math.max(0,Math.ceil(520*(1-progress)))} m`;renderWorld((now-runStart)/1000);const approach=Math.pow(progress,1.65),scale=.36+approach*2.15,top=31+approach*27;school.style.transform=`translate(-50%,-50%) scale(${scale})`;school.style.top=`${top}%`;if(progress>=1){finished=true;clearTimeout(timer);status.textContent='AT SCHOOL';finish.style.display='block';draw(frames[0]);return}raf=requestAnimationFrame(updateWorld)}scene.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});scene.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;if(Math.abs(dy)>Math.abs(dx)&&dy<0)hop();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1)});document.getElementById('restart').onclick=()=>{idx=0;lane=1;setLane(false);restartRun();runLoop()};addEventListener('resize',()=>setLane(false));prep()</script></body></html>
