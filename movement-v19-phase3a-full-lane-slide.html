<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store"><title>Super Zoos V19 Full Lane Slide</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#092b46;font-family:system-ui,-apple-system,sans-serif;touch-action:none}.game{position:fixed;inset:0;display:grid;grid-template-rows:76px 1fr}.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:max(10px,env(safe-area-inset-top)) 16px 8px;background:linear-gradient(#0b3658,#072941);color:#fff;z-index:20}.title{font-weight:950;line-height:1.05;font-size:clamp(13px,2vw,22px)}.score{padding:5px 18px;border-radius:24px;background:#061f35;text-align:center;font-weight:950}.score small{display:block;color:#69cbff}.status{text-align:right;font-weight:950}.scene{position:relative;overflow:hidden;background:#62cdf3}.environment{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;user-select:none;-webkit-user-drag:none}.player{--lane:0px;--hop:0px;position:absolute;left:50%;bottom:-.8%;width:clamp(278px,42vw,378px);height:clamp(360px,53vw,489px);transform:translate(calc(-50% + var(--lane)),var(--hop));transform-origin:50% 100%;transition:transform 210ms cubic-bezier(.22,.75,.25,1);z-index:10}.player.hopping{transition:transform 30ms linear}.player canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 15px 11px #0008)}.shadow{position:absolute;left:50%;bottom:.7%;width:176px;height:32px;border-radius:50%;background:#0005;filter:blur(5px);transform:translateX(-50%);transition:transform 210ms cubic-bezier(.22,.75,.25,1);z-index:9}.hint{position:absolute;left:50%;top:3%;transform:translateX(-50%);padding:8px 14px;border-radius:16px;background:#17364ddd;color:#fff;font-size:11px;font-weight:900;text-align:center;z-index:12;white-space:nowrap}.loading{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:#102f48e8;color:#fff;font-weight:900;z-index:15}@media(max-width:700px){.game{grid-template-rows:82px 1fr}.title{font-size:13px}.score{padding:5px 12px}.player{width:clamp(262px,64vw,355px);height:clamp(340px,81vw,460px);bottom:-1%}.hint{font-size:10px}}</style></head><body><main class="game"><header class="hud"><div class="title">SUPER ZOOS<br>SCHOOL RUN</div><div class="score"><small>SCORE</small><span id="score">000000</span></div><div class="status" id="status">LOADING</div></header><section class="scene" id="scene"><img class="environment" src="assets/environment/approved_school_town_gameplate.jpg?v=19" alt="Super Zoos School road"><div class="hint">PHASE 3A · FULL LANE SLIDE<br>SWIPE ← → TO CHANGE LANE · SWIPE ↑ TO HOP</div><div class="shadow" id="shadow"></div><div class="player" id="player"><canvas id="peter" width="400" height="520"></canvas></div><div class="loading" id="loading">Preparing Spider-Boy…</div></section></main><script>const BUILD='v19-full-lane-slide';const RUN='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter/prototype/run';const urls=Array.from({length:12},(_,i)=>`${RUN}/run-${String(i+1).padStart(2,'0')}.png?${BUILD}`);let frames=[],idx=0,lane=1,ready=false,hopping=false,sliding=false,timer,startX=0,startY=0,points=0;const SLIDE_MS=210;const canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),player=document.getElementById('player'),shadow=document.getElementById('shadow'),status=document.getElementById('status'),loading=document.getElementById('loading'),scene=document.getElementById('scene'),score=document.getElementById('score');function load(src){return new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}function isolate(img){const s=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data,m=new Uint8Array(w*h);for(let p=0,k=0;p<m.length;p++,k+=4){const r=d[k],g=d[k+1],b=d[k+2],a=d[k+3];m[p]=a>20&&((r>48&&r>g*1.18&&r>b*1.08)||(r<145&&g<145&&b<145))?1:0}const seen=new Uint8Array(m.length);let win,best=-1;for(let p=0;p<m.length;p++){if(!m[p]||seen[p])continue;const st=[p],comp=[];seen[p]=1;let sx=0,sy=0;while(st.length){const q=st.pop(),qx=q%w,qy=q/w|0;comp.push(q);sx+=qx;sy+=qy;for(const n of [qx>0?q-1:-1,qx<w-1?q+1:-1,qy>0?q-w:-1,qy<h-1?q+w:-1])if(n>=0&&m[n]&&!seen[n]){seen[n]=1;st.push(n)}}const cx=sx/comp.length,cy=sy/comp.length,dist=Math.hypot((cx-w/2)/w,(cy-h*.58)/h),sc=comp.length/(1+3*dist);if(comp.length>120&&sc>best){best=sc;win=comp}}if(!win)throw Error('run component missing');const keep=new Uint8Array(m.length);for(const p of win)keep[p]=1;let minX=w,minY=h,maxX=0,maxY=0;for(let p=0;p<keep.length;p++){const k=p*4;if(!keep[p])d[k+3]=0;else{const px=p%w,py=p/w|0;minX=Math.min(minX,px);maxX=Math.max(maxX,px);minY=Math.min(minY,py);maxY=Math.max(maxY,py)}}x.putImageData(im,0,0);const pad=8,sx=Math.max(0,minX-pad),sy=Math.max(0,minY-pad),sw=Math.min(w-sx,maxX-minX+1+pad*2),sh=Math.min(h-sy,maxY-minY+1+pad*2),out=document.createElement('canvas');out.width=400;out.height=520;const o=out.getContext('2d'),scale=Math.min(330/sw,430/sh),dw=sw*scale,dh=sh*scale;o.drawImage(c,sx,sy,sw,sh,(400-dw)/2,500-dh,dw,dh);return out}async function prep(){try{for(let i=0;i<12;i++){frames.push(isolate(await load(urls[i])));status.textContent=`RUN ${i+1}/12`}ready=true;loading.remove();setLane(false);loop()}catch(e){loading.textContent='LOAD ERROR';status.textContent='ERROR';console.error(e)}}function draw(f=frames[idx]){ctx.clearRect(0,0,400,520);ctx.drawImage(f,0,0)}function loop(){clearTimeout(timer);if(!ready||hopping)return;draw();points++;score.textContent=String(points).padStart(6,'0');status.textContent=`LANE ${lane+1} · RUN ${idx+1}/12`;timer=setTimeout(()=>{idx=(idx+1)%12;loop()},115)}function laneCenters(){const rect=scene.getBoundingClientRect();const w=rect.width;return[-0.26*w,0,0.26*w]}function setLane(animate=true){const x=laneCenters()[lane];if(!animate){player.style.transition='none';shadow.style.transition='none'}player.style.setProperty('--lane',`${x}px`);shadow.style.transform=`translateX(calc(-50% + ${x}px))`;if(!animate){requestAnimationFrame(()=>{player.style.transition=`transform ${SLIDE_MS}ms cubic-bezier(.22,.75,.25,1)`;shadow.style.transition=`transform ${SLIDE_MS}ms cubic-bezier(.22,.75,.25,1)`})}}function move(d){if(!ready||hopping||sliding)return;const next=Math.max(0,Math.min(2,lane+d));if(next===lane)return;lane=next;sliding=true;setLane(true);status.textContent=`SLIDING TO LANE ${lane+1}`;setTimeout(()=>{sliding=false;status.textContent=`LANE ${lane+1} · RUN ${idx+1}/12`},SLIDE_MS+20)}function hop(){if(!ready||hopping||sliding)return;hopping=true;clearTimeout(timer);player.classList.add('hopping');const frozen=frames[0],duration=760,height=132,start=performance.now();function step(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop',`${y}px`);draw(frozen);if(t<1)requestAnimationFrame(step);else{player.style.setProperty('--hop','0px');player.classList.remove('hopping');hopping=false;idx=1;loop()}}requestAnimationFrame(step)}scene.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});scene.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;if(Math.abs(dy)>Math.abs(dx)&&dy<0)hop();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1)});addEventListener('resize',()=>setLane(false));prep()</script></body></html>
