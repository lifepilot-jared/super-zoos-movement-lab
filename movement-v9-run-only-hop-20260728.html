<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store"><title>Super Zoos Movement Lab V9 Run Only Hop</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#8ed8f1;touch-action:none}.lab{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#18344a;color:#fff;font-weight:900;z-index:5}.scene{position:relative;overflow:hidden;background:linear-gradient(#7dd3f1 0 42%,#77b75e 42% 100%)}.school{position:absolute;top:8%;left:50%;transform:translateX(-50%);width:min(76vw,700px);height:18%;border-radius:12px 12px 0 0;background:#d9a45e;border:6px solid #a66d35;color:#fff;text-align:center;padding-top:18px;font-weight:900}.road{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(50vw,520px);height:72%;background:linear-gradient(90deg,#4f5962,#69747d 48%,#4f5962);clip-path:polygon(37% 0,63% 0,100% 100%,0 100%)}.road:after{content:"";position:absolute;left:49%;top:3%;width:2%;height:90%;background:repeating-linear-gradient(to bottom,#fff 0 18px,transparent 18px 40px)}.player{--hop-y:0px;position:absolute;left:50%;bottom:8%;width:clamp(145px,22vw,220px);height:clamp(190px,28vw,280px);transform:translate(-50%,var(--hop-y));transform-origin:50% 100%;z-index:3;background:transparent}.player canvas{display:block;width:100%;height:100%;background:transparent;filter:drop-shadow(0 8px 7px #0005)}.hurdle{position:absolute;left:50%;bottom:7%;transform:translateX(135px);width:70px;height:42px;border:8px solid #f3f5f7;border-top-width:12px;border-radius:4px;z-index:2}.note{position:absolute;left:50%;top:29%;transform:translateX(-50%);padding:7px 10px;border-radius:999px;background:#fffbdc;color:#26384a;font-size:12px;font-weight:800;z-index:4}.controls{display:flex;justify-content:center;padding:12px;background:#10273a}.jump{min-width:170px;padding:15px 28px;border:0;border-radius:999px;background:#ffd43b;color:#182738;font-size:20px;font-weight:950;box-shadow:0 5px 0 #c58c00}.jump:active{transform:translateY(3px);box-shadow:0 2px 0 #c58c00}.loading{position:absolute;left:50%;bottom:25%;transform:translateX(-50%);padding:9px 12px;border-radius:10px;background:#18344ae8;color:#fff;font-weight:800;z-index:6;white-space:nowrap}@media(max-width:700px){.school{width:84vw;height:15%;font-size:12px}.road{width:72vw}.player{width:clamp(138px,34vw,190px);height:clamp(180px,44vw,245px);bottom:9%}.hurdle{transform:translateX(105px);width:55px;height:34px}.note{top:26%}}</style></head><body><main class="lab"><header class="top"><strong>SUPER ZOOS MOVEMENT LAB V9 — RUN ONLY HOP</strong><span id="status">LOADING</span></header><section class="scene" id="scene"><div class="school">SUPER ZOOS SCHOOL</div><div class="road"></div><div class="note">Tap JUMP or swipe up</div><div id="player" class="player"><canvas id="peter" width="400" height="520"></canvas></div><div id="loading" class="loading">Preparing run frames…</div><div class="hurdle"></div></section><footer class="controls"><button class="jump" id="jump" disabled>JUMP</button></footer></main><script>const BUILD='v9-run-only-hop-20260728';const RUN_SOURCE='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter/prototype/run';const runURLs=Array.from({length:12},(_,i)=>`${RUN_SOURCE}/run-${String(i+1).padStart(2,'0')}.png?${BUILD}`);let runFrames=[],runIndex=0,ready=false,hopping=false,timer=null,startY=null;const canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),player=document.getElementById('player'),status=document.getElementById('status'),button=document.getElementById('jump'),loading=document.getElementById('loading');function load(src){return new Promise((resolve,reject)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}function isolateRun(img){const max=720,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true,alpha:true});x.drawImage(img,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data,mask=new Uint8Array(w*h);for(let p=0,k=0;p<mask.length;p++,k+=4){const r=d[k],g=d[k+1],b=d[k+2],a=d[k+3],red=r>48&&r>g*1.18&&r>b*1.08,dark=r<145&&g<145&&b<145;mask[p]=a>20&&(red||dark)?1:0}const seen=new Uint8Array(w*h);let winner=null,best=-1;for(let p=0;p<mask.length;p++){if(!mask[p]||seen[p])continue;const st=[p],comp=[];seen[p]=1;let sx=0,sy=0;while(st.length){const q=st.pop(),qx=q%w,qy=q/w|0;comp.push(q);sx+=qx;sy+=qy;if(qx>0&&mask[q-1]&&!seen[q-1]){seen[q-1]=1;st.push(q-1)}if(qx<w-1&&mask[q+1]&&!seen[q+1]){seen[q+1]=1;st.push(q+1)}if(qy>0&&mask[q-w]&&!seen[q-w]){seen[q-w]=1;st.push(q-w)}if(qy<h-1&&mask[q+w]&&!seen[q+w]){seen[q+w]=1;st.push(q+w)}}const cx=sx/comp.length,cy=sy/comp.length,dist=Math.hypot((cx-w/2)/w,(cy-h*.58)/h),score=comp.length/(1+3*dist);if(comp.length>120&&score>best){best=score;winner=comp}}if(!winner)throw new Error('run component missing');const keep=new Uint8Array(w*h);for(const p of winner)keep[p]=1;let minX=w,minY=h,maxX=-1,maxY=-1;for(let p=0;p<keep.length;p++){const k=p*4;if(!keep[p]){d[k+3]=0;continue}const px=p%w,py=p/w|0;if(px<minX)minX=px;if(px>maxX)maxX=px;if(py<minY)minY=py;if(py>maxY)maxY=py}x.putImageData(im,0,0);const pad=8;minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w-1,maxX+pad);maxY=Math.min(h-1,maxY+pad);const sw=maxX-minX+1,sh=maxY-minY+1,out=document.createElement('canvas');out.width=400;out.height=520;const o=out.getContext('2d',{alpha:true}),scale=Math.min(330/sw,430/sh),dw=sw*scale,dh=sh*scale;o.drawImage(c,minX,minY,sw,sh,(400-dw)/2,500-dh,dw,dh);return out}async function prepare(){try{for(let i=0;i<12;i++){runFrames.push(isolateRun(await load(runURLs[i])));status.textContent=`RUN ${i+1}/12 READY`}ready=true;loading.remove();button.disabled=false;schedule()}catch(e){loading.textContent='LOAD ERROR';status.textContent='ERROR';console.error(e)}}function draw(frame=runFrames[runIndex]){ctx.clearRect(0,0,400,520);ctx.drawImage(frame,0,0)}function schedule(){clearTimeout(timer);if(!ready)return;if(!hopping){draw();status.textContent=`RUN ${runIndex+1}/12`;timer=setTimeout(()=>{runIndex=(runIndex+1)%12;schedule()},115)}}function requestJump(){if(!ready||hopping)return;hopping=true;clearTimeout(timer);const frozen=runFrames[0];const duration=760,height=118,start=performance.now();function hop(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop-y',`${y}px`);draw(frozen);status.textContent=`HOP ${Math.round(t*100)}%`;if(t<1)requestAnimationFrame(hop);else{player.style.setProperty('--hop-y','0px');hopping=false;runIndex=1;schedule()}}requestAnimationFrame(hop)}button.addEventListener('click',requestJump);window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();requestJump()}});const scene=document.getElementById('scene');scene.addEventListener('pointerdown',e=>startY=e.clientY);scene.addEventListener('pointerup',e=>{if(startY!==null&&startY-e.clientY>28)requestJump();startY=null});scene.addEventListener('pointercancel',()=>startY=null);prepare()</script></body></html>
