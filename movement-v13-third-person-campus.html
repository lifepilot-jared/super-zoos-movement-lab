<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store"><title>Super Zoos V13 Third Person Campus</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#63cffa;touch-action:none}.game{position:fixed;inset:0;display:grid;grid-template-rows:74px 1fr}.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:max(10px,env(safe-area-inset-top)) 16px 8px;background:linear-gradient(#0a3555,#072640);color:#fff;z-index:30}.title{font-weight:950;line-height:1}.score{background:#061d31;border-radius:22px;padding:6px 20px;text-align:center;font-weight:950}.score small{display:block;color:#69cfff}.status{text-align:right;font-weight:900}.scene{position:relative;overflow:hidden;perspective:900px;background:linear-gradient(#65cdf5 0 33%,#b8ecff 33% 36%,#69b84d 36% 100%)}.skyline{position:absolute;left:0;right:0;top:4%;height:33%;z-index:2}.school{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(36vw,430px);height:78%;background:#e5bc6e;border:5px solid #9d6337;box-shadow:0 10px 16px #0003}.school:before{content:"";position:absolute;left:-5px;right:-5px;top:-28px;height:30px;background:#c95735;clip-path:polygon(7% 100%,16% 0,84% 0,93% 100%)}.school .sign{position:absolute;left:50%;top:10%;transform:translateX(-50%);background:#963f31;color:#fff;padding:6px 18px;border-radius:5px;font-weight:950;white-space:nowrap}.school .door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:18%;height:42%;background:#315d79;border:5px solid #f1dba8}.wing,.house{position:absolute;bottom:0;border:4px solid #915d35;box-shadow:0 8px 12px #0002}.wing{width:22vw;height:58%;background:#dc9953}.wing.l{right:67%}.wing.r{left:67%;background:#e7c979}.house{width:17vw;height:48%;background:#cc7549}.house.l{right:89%}.house.r{left:89%;background:#d4a95e}.road-world{position:absolute;left:0;right:0;top:30%;bottom:0;z-index:4;overflow:hidden}.road{position:absolute;left:50%;top:0;bottom:-4%;width:112%;transform:translateX(-50%);clip-path:polygon(43% 0,57% 0,86% 100%,14% 100%);background:linear-gradient(90deg,#30353a 0,#454b50 10%,#4f555b 50%,#454b50 90%,#30353a);overflow:hidden}.road:before,.road:after{content:"";position:absolute;top:0;bottom:0;width:4px;background:#f2d04a}.road:before{left:14%}.road:after{right:14%}.lane-line{position:absolute;top:-120%;bottom:-120%;width:5px;background:repeating-linear-gradient(to bottom,#fff 0 32px,transparent 32px 76px);animation:flow .8s linear infinite}.lane-line.one{left:42.6%}.lane-line.two{left:57.4%}@keyframes flow{to{transform:translateY(76px)}}.side{position:absolute;top:0;bottom:0;width:31%;overflow:hidden}.side.left{left:0;background:linear-gradient(90deg,#3f9d37,#73bd4f)}.side.right{right:0;background:linear-gradient(90deg,#73bd4f,#3f9d37)}.walk{position:absolute;top:0;bottom:0;width:8%;background:linear-gradient(90deg,#b5afa5,#eee8df,#b5afa5)}.walk.left{left:22%}.walk.right{right:22%}.prop{position:absolute;top:-20%;animation:propMove 4.6s linear infinite;transform-origin:50% 100%;filter:drop-shadow(0 8px 6px #0004)}@keyframes propMove{0%{transform:translateY(-12vh) scale(.35);opacity:.35}45%{opacity:1}100%{transform:translateY(96vh) scale(1.7);opacity:1}}.left .prop{right:8%}.right .prop{left:8%}.tree{width:64px;height:120px}.tree:before{content:"";position:absolute;left:27px;bottom:0;width:12px;height:54px;background:#7b4d2f}.tree:after{content:"";position:absolute;left:4px;top:0;width:56px;height:68px;border-radius:50%;background:#2b8d43;box-shadow:18px 12px 0 #42ad58,-15px 14px 0 #26783a}.lamp{width:32px;height:128px;border-left:7px solid #314754}.lamp:after{content:"";position:absolute;left:-13px;top:0;width:32px;height:26px;border-radius:7px;background:#fff2b6;border:5px solid #314754}.banner{width:54px;height:102px;background:#0a5394;border:5px solid #e3b42d;color:#ffd54d;font-size:11px;font-weight:950;text-align:center;padding-top:18px}.bench{width:88px;height:38px;border-top:12px solid #8d512d;border-bottom:8px solid #8d512d}.p1{animation-delay:-.4s}.p2{animation-delay:-1.6s}.p3{animation-delay:-2.8s}.p4{animation-delay:-3.8s}.player{--lane:0px;--hop:0px;position:absolute;left:50%;bottom:4%;width:clamp(165px,24vw,235px);height:clamp(215px,31vw,300px);transform:translate(calc(-50% + var(--lane)),var(--hop));transform-origin:50% 100%;transition:transform 170ms ease-out;z-index:20}.player.hopping{transition:transform 30ms linear}.player canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 12px 8px #0008)}.shadow{position:absolute;left:50%;bottom:4%;width:110px;height:25px;border-radius:50%;background:#0005;filter:blur(4px);z-index:18;transform:translateX(-50%)}.hint{position:absolute;left:50%;top:42%;transform:translateX(-50%);padding:10px 16px;border-radius:18px;background:#17354ddb;color:#fff;text-align:center;font-weight:900;z-index:25}.loading{position:absolute;left:50%;bottom:25%;transform:translateX(-50%);padding:10px 14px;background:#0a2e47e8;color:#fff;border-radius:10px;font-weight:900;z-index:40}@media(max-width:700px){.game{grid-template-rows:68px 1fr}.title{font-size:13px}.score{padding:5px 12px}.skyline{height:28%;top:4%}.school{width:44vw}.wing{width:25vw}.road-world{top:25%}.road{width:150%;clip-path:polygon(46% 0,54% 0,82% 100%,18% 100%)}.side{width:27%}.walk.left{left:19%}.walk.right{right:19%}.player{width:clamp(150px,39vw,205px);height:clamp(195px,49vw,265px);bottom:5%}.hint{top:38%;font-size:11px}.left .prop{right:2%}.right .prop{left:2%}}</style></head><body><main class="game"><header class="hud"><div class="title">SUPER ZOOS<br>SCHOOL RUN</div><div class="score"><small>SCORE</small><span id="score">000000</span></div><div class="status" id="status">LOADING</div></header><section class="scene" id="scene"><div class="skyline"><div class="house l"></div><div class="wing l"></div><div class="school"><div class="sign">SUPER ZOOS SCHOOL</div><div class="door"></div></div><div class="wing r"></div><div class="house r"></div></div><div class="road-world"><div class="side left"><div class="prop tree p1"></div><div class="prop lamp p2"></div><div class="prop banner p3">SUPER<br>ZOOS</div><div class="prop bench p4"></div></div><div class="walk left"></div><div class="road"><div class="lane-line one"></div><div class="lane-line two"></div></div><div class="walk right"></div><div class="side right"><div class="prop lamp p1"></div><div class="prop tree p2"></div><div class="prop bench p3"></div><div class="prop banner p4">SUPER<br>ZOOS</div></div></div><div class="hint">SWIPE ← → TO CHANGE LANE<br>SWIPE ↑ TO HOP</div><div class="shadow" id="shadow"></div><div class="player" id="player"><canvas id="peter" width="400" height="520"></canvas></div><div class="loading" id="loading">Preparing Spider-Boy…</div></section></main><script>const BUILD='v13-third-person';const RUN='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter/prototype/run';const urls=Array.from({length:12},(_,i)=>`${RUN}/run-${String(i+1).padStart(2,'0')}.png?${BUILD}`);let frames=[],idx=0,lane=1,ready=false,hopping=false,timer,startX=0,startY=0,points=0;const canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),player=document.getElementById('player'),shadow=document.getElementById('shadow'),status=document.getElementById('status'),loading=document.getElementById('loading'),scene=document.getElementById('scene'),score=document.getElementById('score');function load(src){return new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}function isolate(img){const s=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data,m=new Uint8Array(w*h);for(let p=0,k=0;p<m.length;p++,k+=4){const r=d[k],g=d[k+1],b=d[k+2],a=d[k+3];m[p]=a>20&&((r>48&&r>g*1.18&&r>b*1.08)||(r<145&&g<145&&b<145))?1:0}const seen=new Uint8Array(m.length);let win,best=-1;for(let p=0;p<m.length;p++){if(!m[p]||seen[p])continue;const st=[p],comp=[];seen[p]=1;let sx=0,sy=0;while(st.length){const q=st.pop(),qx=q%w,qy=q/w|0;comp.push(q);sx+=qx;sy+=qy;for(const n of [qx>0?q-1:-1,qx<w-1?q+1:-1,qy>0?q-w:-1,qy<h-1?q+w:-1])if(n>=0&&m[n]&&!seen[n]){seen[n]=1;st.push(n)}}const cx=sx/comp.length,cy=sy/comp.length,dist=Math.hypot((cx-w/2)/w,(cy-h*.58)/h),sc=comp.length/(1+3*dist);if(comp.length>120&&sc>best){best=sc;win=comp}}if(!win)throw Error('run component missing');const keep=new Uint8Array(m.length);for(const p of win)keep[p]=1;let minX=w,minY=h,maxX=0,maxY=0;for(let p=0;p<keep.length;p++){const k=p*4;if(!keep[p])d[k+3]=0;else{const px=p%w,py=p/w|0;minX=Math.min(minX,px);maxX=Math.max(maxX,px);minY=Math.min(minY,py);maxY=Math.max(maxY,py)}}x.putImageData(im,0,0);const pad=8,sw=maxX-minX+1+pad*2,sh=maxY-minY+1+pad*2,out=document.createElement('canvas');out.width=400;out.height=520;const o=out.getContext('2d'),scale=Math.min(330/sw,430/sh),dw=sw*scale,dh=sh*scale;o.drawImage(c,Math.max(0,minX-pad),Math.max(0,minY-pad),sw,sh,(400-dw)/2,500-dh,dw,dh);return out}async function prep(){try{for(let i=0;i<12;i++){frames.push(isolate(await load(urls[i])));status.textContent=`RUN ${i+1}/12`}ready=true;loading.remove();setLane();loop()}catch(e){loading.textContent='LOAD ERROR';status.textContent='ERROR'}}function draw(f=frames[idx]){ctx.clearRect(0,0,400,520);ctx.drawImage(f,0,0)}function loop(){clearTimeout(timer);if(!ready||hopping)return;draw();points++;score.textContent=String(points).padStart(6,'0');status.textContent=`LANE ${lane+1} · RUN ${idx+1}/12`;timer=setTimeout(()=>{idx=(idx+1)%12;loop()},115)}function laneWidth(){return Math.min(innerWidth*.22,230)}function setLane(){const x=(lane-1)*laneWidth();player.style.setProperty('--lane',`${x}px`);shadow.style.transform=`translateX(calc(-50% + ${x}px))`}function move(d){lane=Math.max(0,Math.min(2,lane+d));setLane()}function hop(){if(!ready||hopping)return;hopping=true;clearTimeout(timer);player.classList.add('hopping');const frozen=frames[0],duration=760,height=128,start=performance.now();function step(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop',`${y}px`);shadow.style.opacity=`${.45-.28*Math.sin(Math.PI*t)}`;draw(frozen);if(t<1)requestAnimationFrame(step);else{player.style.setProperty('--hop','0px');player.classList.remove('hopping');shadow.style.opacity='.45';hopping=false;idx=1;loop()}}requestAnimationFrame(step)}scene.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});scene.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;if(Math.abs(dy)>Math.abs(dx)&&dy<-28)hop();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1)});window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft')move(-1);if(e.code==='ArrowRight')move(1);if(e.code==='ArrowUp'||e.code==='Space')hop()});addEventListener('resize',setLane);prep()</script></body></html>
