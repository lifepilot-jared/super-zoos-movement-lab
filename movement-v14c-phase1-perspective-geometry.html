<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store"><title>Super Zoos Phase 1C</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#69cff4;touch-action:none}.game{position:fixed;inset:0;display:grid;grid-template-rows:82px 1fr}.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:max(10px,env(safe-area-inset-top)) 16px 8px;background:linear-gradient(#0b3658,#072941);color:#fff;z-index:50}.title{font-weight:950;line-height:1.05;font-size:13px}.score{padding:5px 14px;border-radius:24px;background:#061f35;text-align:center;font-weight:950}.score small{display:block;color:#69cbff}.status{text-align:right;font-weight:950}.scene{position:relative;overflow:hidden;background:linear-gradient(#62cdf3 0 27%,#bcecff 27% 31%,#79c455 31% 100%)}.campus{position:absolute;left:0;right:0;top:5%;height:27%;z-index:2}.building{position:absolute;bottom:0;border:4px solid #98532f;box-shadow:0 8px 18px #0003}.building:before{content:"";position:absolute;left:-4px;right:-4px;top:-20px;height:20px;background:#c75434;clip-path:polygon(7% 100%,16% 0,84% 0,93% 100%)}.main{left:50%;transform:translateX(-50%);width:38vw;max-width:390px;height:76%;background:#e9bc67;z-index:4}.wingL{right:69%;width:27vw;height:55%;background:#d77f48}.wingR{left:69%;width:27vw;height:55%;background:#e2c26e}.schoolSign{position:absolute;left:50%;top:13%;transform:translateX(-50%);padding:6px 14px;border-radius:6px;background:#963e31;color:#fff;font-weight:950;white-space:nowrap}.door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:18%;height:44%;background:#315a78;border:5px solid #f0dcaa}.windowRow{position:absolute;left:8%;right:8%;top:39%;display:flex;justify-content:space-between}.windowRow i{width:14%;height:23px;background:#9ee5ff;border:4px solid #f6e6b7}.world{position:absolute;left:0;right:0;top:28%;bottom:0;z-index:5}.perspective{position:absolute;inset:0;width:100%;height:100%;display:block}.roadSurface{fill:url(#roadGrad)}.footpath{fill:#d9d4ca}.curb{fill:#f1d24a}.grass{fill:#66b84b}.lane{fill:#fff}.roadShade{fill:url(#shadeGrad)}.player{--lane:0px;--hop:0px;position:absolute;left:50%;bottom:2.5%;width:40vw;max-width:215px;height:50vw;max-height:270px;transform:translate(calc(-50% + var(--lane)),var(--hop));transform-origin:50% 100%;transition:transform 170ms ease-out;z-index:30}.player.hopping{transition:transform 30ms linear}.player canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 13px 9px #0008)}.shadow{position:absolute;left:50%;bottom:3.1%;width:112px;height:25px;border-radius:50%;background:#0005;filter:blur(4px);transform:translateX(-50%);z-index:25}.hint{position:absolute;left:50%;top:2.5%;transform:translateX(-50%);padding:7px 13px;border-radius:16px;background:#17364ddd;color:#fff;font-size:10px;font-weight:900;text-align:center;z-index:35;white-space:nowrap}.source{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.loading{position:absolute;left:50%;bottom:23%;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:#102f48e8;color:#fff;font-weight:900;z-index:40}</style></head><body><main class="game"><header class="hud"><div class="title">SUPER ZOOS<br>SCHOOL RUN</div><div class="score"><small>SCORE</small><span id="score">000000</span></div><div class="status" id="status">LOADING</div></header><section class="scene" id="scene"><div class="campus"><div class="building wingL"></div><div class="building main"><div class="schoolSign">SUPER ZOOS SCHOOL</div><div class="door"></div><div class="windowRow"><i></i><i></i><i></i><i></i></div></div><div class="building wingR"></div></div><div class="world"><svg class="perspective" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#565d63"/><stop offset="1" stop-color="#292e32"/></linearGradient><linearGradient id="shadeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff18"/><stop offset=".35" stop-color="#ffffff00"/><stop offset="1" stop-color="#00000028"/></linearGradient></defs><polygon class="grass" points="0,0 345,0 40,1000 0,1000"/><polygon class="grass" points="655,0 1000,0 1000,1000 960,1000"/><polygon class="footpath" points="345,0 405,0 90,1000 40,1000"/><polygon class="footpath" points="595,0 655,0 960,1000 910,1000"/><polygon class="curb" points="397,0 405,0 90,1000 78,1000"/><polygon class="curb" points="595,0 603,0 922,1000 910,1000"/><polygon class="roadSurface" points="405,0 595,0 910,1000 90,1000"/><polygon class="roadShade" points="405,0 595,0 910,1000 90,1000"/><g id="marks"><polygon class="lane" points="466,95 473,95 376,265 364,265"/><polygon class="lane" points="452,330 466,330 400,470 382,470"/><polygon class="lane" points="425,555 447,555 384,725 353,725"/><polygon class="lane" points="387,800 420,800 368,1000 320,1000"/><polygon class="lane" points="527,95 534,95 636,265 624,265"/><polygon class="lane" points="534,330 548,330 618,470 600,470"/><polygon class="lane" points="553,555 575,555 647,725 616,725"/><polygon class="lane" points="580,800 613,800 680,1000 632,1000"/></g></svg></div><div class="hint">PHASE 1C · TRUE PERSPECTIVE ROAD</div><div class="shadow" id="shadow"></div><div class="player" id="player"><canvas id="peter" width="400" height="520"></canvas></div><div class="loading" id="loading">Preparing Spider-Boy…</div><iframe class="source" id="source" src="movement-v14b-phase1-camera-road-verified.html"></iframe></section></main><script>let lane=1,hopping=false,startX=0,startY=0,points=0;const scene=document.getElementById('scene'),player=document.getElementById('player'),shadow=document.getElementById('shadow'),canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),status=document.getElementById('status'),score=document.getElementById('score'),loading=document.getElementById('loading'),source=document.getElementById('source');function laneStep(){return Math.min(innerWidth*.255,245)}function setLane(){const x=(lane-1)*laneStep();player.style.setProperty('--lane',`${x}px`);shadow.style.transform=`translateX(calc(-50% + ${x}px))`}function move(d){lane=Math.max(0,Math.min(2,lane+d));setLane()}function hop(){if(hopping)return;hopping=true;player.classList.add('hopping');const duration=760,height=120,start=performance.now();function step(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop',`${y}px`);if(t<1)requestAnimationFrame(step);else{player.style.setProperty('--hop','0px');player.classList.remove('hopping');hopping=false}}requestAnimationFrame(step)}function mirror(){try{const d=source.contentDocument,c=d&&d.getElementById('peter');if(c&&c.width){ctx.clearRect(0,0,400,520);ctx.drawImage(c,0,0);if(loading)loading.remove();const s=d.getElementById('status');status.textContent=s?s.textContent:`LANE ${lane+1}`;points++;score.textContent=String(points).padStart(6,'0')}}catch(e){}requestAnimationFrame(mirror)}source.addEventListener('load',mirror,{once:true});scene.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});scene.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;if(Math.abs(dy)>Math.abs(dx)&&dy<0)hop();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1)});addEventListener('resize',setLane);setLane();</script></body></html>
