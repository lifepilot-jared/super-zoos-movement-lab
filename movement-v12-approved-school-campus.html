m-origin:50% 100%}.leftStrip .prop{right:7%}.rightStrip .prop{left:7%}@keyframes prop{0%{transform:translateY(-10vh) scale(.35);opacity:.25}45%{opacity:1}100%{transform:translateY(100vh) scale(1.55);opacity:1}}.tree{width:64px;height:120px}.tree:before{content:"";position:absolute;left:27px;bottom:0;width:12px;height:54px;background:#81512d}.tree:after{content:"";position:absolute;left:4px;top:0;width:56px;height:68px;border-radius:50%;background:#2c9145;box-shadow:18px 12px 0 #42ad58,-15px 14px 0 #267c3b}.lamp{width:34px;height:130px;border-left:8px solid #344754}.lamp:after{content:"";position:absolute;left:-13px;top:0;width:34px;height:28px;border-radius:8px;background:#fff4bd;border:5px solid #344754}.banner{width:55px;height:100px;background:#0a5394;border:5px solid #e4b632;color:#ffd54d;font-weight:950;font-size:11px;text-align:center;padding-top:18px;box-shadow:0 6px 8px #0004}.bench{width:88px;height:38px;border-top:12px solid #8d512d;border-bottom:8px solid #8d512d;box-shadow:0 8px 0 -3px #4b3325}.p1{animation-delay:-.2s}.p2{animation-delay:-1.4s}.p3{animation-delay:-2.7s}.p4{animation-delay:-3.6s}.player{--lane:0px;--hop:0px;position:absolute;left:50%;bottom:5%;width:clamp(150px,24vw,230px);height:clamp(195px,30vw,290px);transform:translate(calc(-50% + var(--lane)),var(--hop));transform-origin:50% 100%;transition:transform 170ms ease-out;z-index:20}.player.hopping{transition:transform 30ms linear}.player canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 12px 8px #0007)}.shadow{position:absolute;left:50%;bottom:5%;width:100px;height:24px;border-radius:50%;background:#0005;filter:blur(4px);transform:translateX(-50%);z-index:18}.hint{position:absolute;left:50%;top:38%;transform:translateX(-50%);padding:10px 18px;border-radius:18px;background:#16354ddd;color:#fff;font-weight:900;text-align:center;z-index:25;white-space:nowrap}.loading{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);padding:10px 15px;border-radius:10px;background:#0b304ae8;color:#fff;font-weight:900;z-index:30}@media(max-width:700px){.hud{height:70px}.title{font-size:13px}.score{padding:5px 13px}.campus{height:25%;top:4%}.main{width:44vw}.wingL{right:72%;width:25vw}.wingR{left:72%;width:25vw}.grassL,.grassR{width:14%}.walkL,.walkR{width:8%}.walkL{left:14%}.walkR{right:14%}.road{left:22%;right:22%;top:27%}.sideStrip{top:27%;width:22%}.player{width:clamp(145px,36vw,195px);height:clamp(185px,46vw,250px);bottom:6%}.hint{top:31%;font-size:11px;padding:8px 11px}.leftStrip .prop{right:3%}.rightStrip .prop{left:3%}}</style></head><body><main class="game"><header class="hud"><div class="title">SUPER ZOOS<br>SCHOOL RUN</div><div class="score"><small>SCORE</small><span id="score">000000</span></div><div class="status" id="status">LOADING</div></header><section class="scene" id="scene"><div class="cloud c1"></div><div class="cloud c2"></div><div class="campus"><div class="building sideL"></div><div class="building wingL"></div><div class="building main"><div class="sign">SUPER ZOOS SCHOOL</div><div class="door"></div><div class="windows"><i></i><i></i><i></i><i></i></div></div><div class="building wingR"></div><div class="building sideR"></div></div><div class="grassL"></div><div class="grassR"></div><div class="walkL"></div><div class="walkR"></div><div class="road"><div class="divider d1"></div><div class="divider d2"></div><div class="roadShade"></div></div><div class="sideStrip leftStrip"><div class="prop tree p1"></div><div class="prop lamp p2"></div><div class="prop banner p3">SUPER<br>ZOOS</div><div class="prop bench p4"></div></div><div class="sideStrip rightStrip"><div class="prop lamp p1"></div><div class="prop tree p2"></div><div class="prop bench p3"></div><div class="prop banner p4">SUPER<br>ZOOS</div></div><div class="hint">SWIPE ← → TO CHANGE LANE<br>SWIPE ↑ TO HOP</div><div class="shadow" id="shadow"></div><div class="player" id="player"><canvas id="peter" width="400" height="520"></canvas></div><div class="loading" id="loading">Preparing Spider-Boy…</div></section></main><script>const BUILD='v12-campus';const RUN='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter/prototype/run';const urls=Array.from({length:12},(_,i)=>`${RUN}/run-${String(i+1).padStart(2,'0')}.png?${BUILD}`);let frames=[],idx=0,lane=1,ready=false,hopping=false,timer,startX=0,startY=0,points=0;const canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),player=document.getElementById('player'),shadow=document.getElementById('shadow'),status=document.getElementById('status'),loading=document.getElementById('loading'),scene=document.getElementById('scene'),score=document.getElementById('score');function load(src){return new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}function isolate(img){const s=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data,m=new Uint8Array(w*h);for(let p=0,k=0;p<m.length;p++,k+=4){const r=d[k],g=d[k+1],b=d[k+2],a=d[k+3];m[p]=a>20&&((r>48&&r>g*1.18&&r>b*1.08)||(r<145&&g<145&&b<145))?1:0}const seen=new Uint8Array(m.length);let win,best=-1;for(let p=0;p<m.length;p++){if(!m[p]||seen[p])continue;const st=[p],comp=[];seen[p]=1;let sx=0,sy=0;while(st.length){const q=st.pop(),qx=q%w,qy=q/w|0;comp.push(q);sx+=qx;sy+=qy;for(const n of [qx>0?q-1:-1,qx<w-1?q+1:-1,qy>0?q-w:-1,qy<h-1?q+w:-1])if(n>=0&&m[n]&&!seen[n]){seen[n]=1;st.push(n)}}const cx=sx/comp.length,cy=sy/comp.length,dist=Math.hypot((cx-w/2)/w,(cy-h*.58)/h),sc=comp.length/(1+3*dist);if(comp.length>120&&sc>best){best=sc;win=comp}}if(!win)throw Error('run component missing');const keep=new Uint8Array(m.length);for(const p of win)keep[p]=1;let minX=w,minY=h,maxX=0,maxY=0;for(let p=0;p<keep.length;p++){const k=p*4;if(!keep[p])d[k+3]=0;else{const px=p%w,py=p/w|0;minX=Math.min(minX,px);maxX=Math.max(maxX,px);minY=Math.min(minY,py);maxY=Math.max(maxY,py)}}x.putImageData(im,0,0);const pad=8,sw=maxX-minX+1+pad*2,sh=maxY-minY+1+pad*2,out=document.createElement('canvas');out.width=400;out.height=520;const o=out.getContext('2d'),scale=Math.min(330/sw,430/sh),dw=sw*scale,dh=sh*scale;o.drawImage(c,Math.max(0,minX-pad),Math.max(0,minY-pad),sw,sh,(400-dw)/2,500-dh,dw,dh);return out}async function prep(){try{for(let i=0;i<12;i++){frames.push(isolate(await load(urls[i])));status.textContent=`RUN ${i+1}/12`}ready=true;loading.remove();setLane();loop()}catch(e){loading.textContent='LOAD ERROR';status.textContent='ERROR';console.error(e)}}function draw(f=frames[idx]){ctx.clearRect(0,0,400,520);ctx.drawImage(f,0,0)}function loop(){clearTimeout(timer);if(!ready||hopping)return;draw();points++;score.textContent=String(points).padStart(6,'0');status.textContent=`LANE ${lane+1} · RUN ${idx+1}/12`;timer=setTimeout(()=>{idx=(idx+1)%12;loop()},115)}function offset(){const road=document.querySelector('.road').getBoundingClientRect();return(lane-1)*(road.width/3)}function setLane(){const x=offset();player.style.setProperty('--lane',`${x}px`);shadow.style.transform=`translateX(calc(-50% + ${x}px))`}function move(d){lane=Math.max(0,Math.min(2,lane+d));setLane()}function hop(){if(!ready||hopping)return;hopping=true;clearTimeout(timer);player.classList.add('hopping');const frozen=frames[0],start=performance.now(),duration=760,height=125;function step(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop',`${y}px`);draw(frozen);shadow.style.opacity=.45-.3*Math.sin(Math.PI*t);shadow.style.transform=`translateX(calc(-50% + ${offset()}px)) scale(${1-.3*Math.sin(Math.PI*t)})`;status.textContent=`HOP ${Math.round(t*100)}%`;if(t<1)requestAnimationFrame(step);else{player.style.setProperty('--hop','0px');player.classList.remove('hopping');shadow.style.opacity=.45;setLane();hopping=false;idx=1;loop()}}requestAnimationFrame(step)}scene.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});scene.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;if(Math.abs(dy)>Math.abs(dx)&&dy<-30)hop();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1)});window.addEventListener('resize',setLane);window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft')move(-1);if(e.code==='ArrowRight')move(1);if(e.code==='ArrowUp'||e.code==='Space')hop()});prep()</script></body></html>
