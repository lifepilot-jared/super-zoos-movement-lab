<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store"><title>Super Zoos V25 Stabilisation</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#092b46;font-family:system-ui,-apple-system,sans-serif;touch-action:none}.game{position:fixed;inset:0;display:grid;grid-template-rows:86px 1fr}.hud{display:grid;grid-template-columns:1fr minmax(210px,42vw) 1fr;gap:14px;align-items:center;padding:max(10px,env(safe-area-inset-top)) 16px 8px;background:linear-gradient(#0b3658,#072941);color:#fff;z-index:30}.title{font-weight:950;line-height:1.05;font-size:clamp(13px,2vw,22px)}.progressWrap{text-align:center}.progressLabel{font-size:11px;font-weight:900;color:#8bd7ff;margin-bottom:5px}.track{height:17px;border-radius:999px;background:#061f35;border:2px solid #ffffff33;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#39c7ff,#ffe052)}.distance{font-size:11px;font-weight:900;margin-top:4px}.status{text-align:right;font-weight:950}.scene{position:relative;overflow:hidden;background:#62cdf3}.environmentBack,.environment{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-drag:none}.environmentBack{object-fit:cover;filter:blur(18px) brightness(.78);transform:scale(1.08)}.environment{object-fit:fill;left:5%;width:90%;z-index:1;transform-origin:50% 58%;will-change:transform}.player{--lane:0px;--hop:0px;position:absolute;left:50%;bottom:-.8%;width:clamp(278px,42vw,378px);height:clamp(360px,53vw,489px);transform:translate(calc(-50% + var(--lane)),var(--hop));transform-origin:50% 100%;transition:transform 210ms cubic-bezier(.22,.75,.25,1);z-index:10}.player.hopping{transition:transform 30ms linear}.player canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 15px 11px #0008)}.shadow{position:absolute;left:50%;bottom:.7%;width:176px;height:32px;border-radius:50%;background:#0005;filter:blur(5px);transform:translateX(-50%);transition:transform 210ms cubic-bezier(.22,.75,.25,1);z-index:9}.hint{position:absolute;left:50%;top:3%;transform:translateX(-50%);padding:8px 14px;border-radius:16px;background:#17364ddd;color:#fff;font-size:11px;font-weight:900;text-align:center;z-index:12;white-space:nowrap}.loading,.finish{position:absolute;left:50%;transform:translateX(-50%);padding:12px 16px;border-radius:14px;background:#102f48ee;color:#fff;font-weight:900;z-index:40}.loading{bottom:24%}.finish{top:35%;display:none;text-align:center}.finish button{margin-top:12px;border:0;border-radius:999px;padding:10px 18px;background:#ffe052;color:#14314a;font-weight:950}@media(max-width:700px){.game{grid-template-rows:94px 1fr}.hud{grid-template-columns:1fr minmax(160px,44vw) 1fr;gap:8px}.title{font-size:13px}.status{font-size:12px}.player{width:clamp(262px,64vw,355px);height:clamp(340px,81vw,460px);bottom:-1%}.environment{left:4%;width:92%}.hint{font-size:10px}}</style></head><body><main class="game"><header class="hud"><div class="title">SUPER ZOOS<br>SCHOOL RUN</div><div class="progressWrap"><div class="progressLabel">DISTANCE TO SCHOOL</div><div class="track"><div class="bar" id="bar"></div></div><div class="distance" id="distance">300 m</div></div><div class="status" id="status">LOADING</div></header><section class="scene" id="scene"><img class="environmentBack" src="assets/environment/approved_school_town_gameplate.jpg?v=25" alt=""><img class="environment" id="environment" src="assets/environment/approved_school_town_gameplate.jpg?v=25" alt="Super Zoos School road"><div class="hint">PHASE 3B-1A · STABILISATION<br>SWIPE ← → TO CHANGE LANES · SWIPE ↑ TO HOP</div><div class="shadow" id="shadow"></div><div class="player" id="player"><canvas id="peter" width="400" height="520"></canvas></div><div class="loading" id="loading">Preparing Spider-Boy…</div><div class="finish" id="finish">PETER MADE IT TO SCHOOL!<br><button id="restart">RUN AGAIN</button></div></section></main><script>const BUILD='v25-stabilisation',RUN='https://raw.githubusercontent.com/lifepilot-jared/super-zoos-adventure-v3/v36-character-animation-foundation/public/assets/characters/peter/prototype/run',urls=Array.from({length:12},(_,i)=>`${RUN}/run-${String(i+1).padStart(2,'0')}.png?${BUILD}`);let frames=[],idx=0,lane=1,ready=false,hopping=false,sliding=false,timer,startX=0,startY=0,progress=0,runStart=0,finished=false,raf=0;const SLIDE_MS=210,RUN_MS=42000;const canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),player=document.getElementById('player'),shadow=document.getElementById('shadow'),status=document.getElementById('status'),loading=document.getElementById('loading'),scene=document.getElementById('scene'),bar=document.getElementById('bar'),distance=document.getElementById('distance'),finish=document.getElementById('finish'),environment=document.getElementById('environment');function load(src){return new Promise((ok,no)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}function isolate(img){const s=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);const im=x.getImageData(0,0,w,h),d=im.data,m=new Uint8Array(w*h);for(let p=0,k=0;p<m.length;p++,k+=4){const r=d[k],g=d[k+1],b=d[k+2],a=d[k+3];m[p]=a>20&&((r>48&&r>g*1.18&&r>b*1.08)||(r<145&&g<145&&b<145))?1:0}const seen=new Uint8Array(m.length);let win,best=-1;for(let p=0;p<m.length;p++){if(!m[p]||seen[p])continue;const st=[p],comp=[];seen[p]=1;let sx=0,sy=0;while(st.length){const q=st.pop(),qx=q%w,qy=q/w|0;comp.push(q);sx+=qx;sy+=qy;for(const n of [qx>0?q-1:-1,qx<w-1?q+1:-1,qy>0?q-w:-1,qy<h-1?q+w:-1])if(n>=0&&m[n]&&!seen[n]){seen[n]=1;st.push(n)}}const cx=sx/comp.length,cy=sy/comp.length,dist=Math.hypot((cx-w/2)/w,(cy-h*.58)/h),sc=comp.length/(1+3*dist);if(comp.length>120&&sc>best){best=sc;win=comp}}if(!win)throw Error('run component missing');const keep=new Uint8Array(m.length);for(const p of win)keep[p]=1;let minX=w,minY=h,maxX=0,maxY=0;for(let p=0;p<keep.length;p++){const k=p*4;if(!keep[p])d[k+3]=0;else{const px=p%w,py=p/w|0;minX=Math.min(minX,px);maxX=Math.max(maxX,px);minY=Math.min(minY,py);maxY=Math.max(maxY,py)}}x.putImageData(im,0,0);const pad=8,sx=Math.max(0,minX-pad),sy=Math.max(0,minY-pad),sw=Math.min(w-sx,maxX-minX+1+pad*2),sh=Math.min(h-sy,maxY-minY+1+pad*2),out=document.createElement('canvas');out.width=400;out.height=520;const o=out.getContext('2d'),scale=Math.min(330/sw,430/sh),dw=sw*scale,dh=sh*scale;o.drawImage(c,sx,sy,sw,sh,(400-dw)/2,500-dh,dw,dh);return out}async function prep(){try{for(let i=0;i<12;i++){frames.push(isolate(await load(urls[i])));status.textContent=`RUN ${i+1}/12`}ready=true;loading.remove();setLane(false);restartRun();runLoop()}catch(e){loading.textContent='LOAD ERROR';status.textContent='ERROR';console.error(e)}}function draw(f=frames[idx]){ctx.clearRect(0,0,400,520);ctx.drawImage(f,0,0)}function runLoop(){clearTimeout(timer);if(!ready||hopping||finished)return;draw();status.textContent=`LANE ${lane+1} · RUN ${idx+1}/12`;timer=setTimeout(()=>{idx=(idx+1)%12;runLoop()},115)}function laneCenters(){const w=scene.getBoundingClientRect().width;return[-w*.355,0,w*.355]}function setLane(animate=true){const x=laneCenters()[lane];if(!animate){player.style.transition='none';shadow.style.transition='none'}player.style.setProperty('--lane',`${x}px`);shadow.style.transform=`translateX(calc(-50% + ${x}px))`;if(!animate)requestAnimationFrame(()=>{player.style.transition=`transform ${SLIDE_MS}ms cubic-bezier(.22,.75,.25,1)`;shadow.style.transition=`transform ${SLIDE_MS}ms cubic-bezier(.22,.75,.25,1)`})}function move(d){if(!ready||hopping||sliding||finished)return;const next=Math.max(0,Math.min(2,lane+d));if(next===lane)return;lane=next;sliding=true;setLane(true);setTimeout(()=>sliding=false,SLIDE_MS+20)}function hop(){if(!ready||hopping||sliding||finished)return;hopping=true;clearTimeout(timer);player.classList.add('hopping');const frozen=frames[idx],duration=760,height=132,start=performance.now();function step(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop',`${y}px`);draw(frozen);if(t<1)requestAnimationFrame(step);else{player.style.setProperty('--hop','0px');player.classList.remove('hopping');hopping=false;idx=(idx+1)%12;runLoop()}}requestAnimationFrame(step)}function restartRun(){cancelAnimationFrame(raf);finished=false;progress=0;runStart=performance.now();finish.style.display='none';environment.style.transform='translateY(0) scale(1)';raf=requestAnimationFrame(updateWorld)}function updateWorld(now){if(finished)return;progress=Math.min(1,(now-runStart)/RUN_MS);bar.style.width=`${progress*100}%`;distance.textContent=`${Math.max(0,Math.ceil(300*(1-progress)))} m`;const scale=1+progress*1.28;const y=progress*8;environment.style.transform=`translateY(${y}%) scale(${scale})`;if(progress>=1){finished=true;clearTimeout(timer);status.textContent='ARRIVED';finish.style.display='block';draw(frames[0]);return}raf=requestAnimationFrame(updateWorld)}scene.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});scene.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;if(Math.abs(dy)>Math.abs(dx)&&dy<0)hop();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1)});document.getElementById('restart').onclick=()=>{idx=0;lane=1;setLane(false);restartRun();runLoop()};addEventListener('resize',()=>setLane(false));prep()</script></body></html>
