<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store"><title>Super Zoos Phase 1D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#0b3658;touch-action:none}.game{position:fixed;inset:0;display:grid;grid-template-rows:82px 1fr}.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:max(10px,env(safe-area-inset-top)) 16px 8px;background:linear-gradient(#0b3658,#072941);color:#fff;z-index:50}.title{font-weight:950;line-height:1.05;font-size:13px}.score{padding:5px 14px;border-radius:24px;background:#061f35;text-align:center;font-weight:950}.score small{display:block;color:#69cbff}.status{text-align:right;font-weight:950}.scene{position:relative;overflow:hidden;background:#55c8ef}.world{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:1}.missing{position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;background:linear-gradient(#67d0f4,#59a942);color:#102f48;font-weight:900;z-index:2}.missing code{display:block;margin-top:12px;padding:8px;border-radius:8px;background:#fff}.player{--lane:0px;--hop:0px;position:absolute;left:50%;bottom:3%;width:40vw;max-width:215px;height:50vw;max-height:270px;transform:translate(calc(-50% + var(--lane)),var(--hop));transform-origin:50% 100%;transition:transform 170ms ease-out;z-index:20}.player.hopping{transition:transform 30ms linear}.player canvas{display:block;width:100%;height:100%;filter:drop-shadow(0 13px 9px #0008)}.shadow{position:absolute;left:50%;bottom:3.8%;width:112px;height:25px;border-radius:50%;background:#0005;filter:blur(4px);transform:translateX(-50%);z-index:18}.phase{position:absolute;left:50%;top:2.5%;transform:translateX(-50%);padding:7px 13px;border-radius:16px;background:#17364ddd;color:#fff;font-size:10px;font-weight:900;z-index:25;white-space:nowrap}.source{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.loading{position:absolute;left:50%;bottom:23%;transform:translateX(-50%);padding:10px 14px;border-radius:12px;background:#102f48e8;color:#fff;font-weight:900;z-index:40}@media(orientation:landscape){.player{width:20vw;height:26vw;max-width:245px;max-height:318px}.phase{top:2%}}</style></head><body><main class="game"><header class="hud"><div class="title">SUPER ZOOS<br>SCHOOL RUN</div><div class="score"><small>SCORE</small><span id="score">000000</span></div><div class="status" id="status">LOADING</div></header><section class="scene" id="scene"><img id="world" class="world" src="assets/environment/approved-school-road.jpg?v=phase1d" alt="Approved Super Zoos school road environment"><div id="missing" class="missing" hidden>Approved environment asset is not yet present.<code>assets/environment/approved-school-road.jpg</code></div><div class="phase">PHASE 1D · APPROVED IMAGE FOUNDATION</div><div class="shadow" id="shadow"></div><div class="player" id="player"><canvas id="peter" width="400" height="520"></canvas></div><div class="loading" id="loading">Preparing Spider-Boy…</div><iframe class="source" id="source" src="movement-v9-run-only-hop-20260728.html"></iframe></section></main><script>let lane=1,hopping=false,startX=0,startY=0,points=0;const scene=document.getElementById('scene'),player=document.getElementById('player'),shadow=document.getElementById('shadow'),canvas=document.getElementById('peter'),ctx=canvas.getContext('2d',{alpha:true}),status=document.getElementById('status'),score=document.getElementById('score'),loading=document.getElementById('loading'),source=document.getElementById('source'),world=document.getElementById('world'),missing=document.getElementById('missing');world.addEventListener('error',()=>{world.hidden=true;missing.hidden=false});function laneStep(){return Math.min(innerWidth*.235,230)}function setLane(){const x=(lane-1)*laneStep();player.style.setProperty('--lane',`${x}px`);shadow.style.transform=`translateX(calc(-50% + ${x}px))`}function move(d){lane=Math.max(0,Math.min(2,lane+d));setLane()}function hop(){if(hopping)return;hopping=true;player.classList.add('hopping');const duration=760,height=120,start=performance.now();function step(now){const t=Math.min(1,(now-start)/duration),y=-4*height*t*(1-t);player.style.setProperty('--hop',`${y}px`);if(t<1)requestAnimationFrame(step);else{player.style.setProperty('--hop','0px');player.classList.remove('hopping');hopping=false}}requestAnimationFrame(step)}function mirror(){try{const d=source.contentDocument,c=d&&d.getElementById('peter');if(c&&c.width){ctx.clearRect(0,0,400,520);ctx.drawImage(c,0,0);if(loading&&loading.isConnected)loading.remove();const s=d.getElementById('status');status.textContent=s?s.textContent:`LANE ${lane+1}`;points++;score.textContent=String(points).padStart(6,'0')}}catch(e){}requestAnimationFrame(mirror)}source.addEventListener('load',mirror,{once:true});scene.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});scene.addEventListener('pointerup',e=>{const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<28)return;if(Math.abs(dy)>Math.abs(dx)&&dy<0)hop();else if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1)});addEventListener('resize',setLane);setLane();</script></body></html>
